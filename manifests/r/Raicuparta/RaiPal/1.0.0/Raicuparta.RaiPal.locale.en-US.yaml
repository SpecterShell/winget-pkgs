ReleaseNotes: |-
  - UI has been rebuilt from scratch with different tech. It's a lot faster, and uses way less RAM than before (we all need it).
  - Lots of general UI changes, hopefully mostly for the better.
  - New portable version for Windows. Doesn't require admin privileges, no installer, and all files managed by Rai Pal (like mods) are in the RaiPalData folder next to the Rai Pal exe.
  - Preparations for native MacOS support (there's a build you can test but doesn't do much yet).
