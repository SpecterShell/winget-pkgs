ShortDescription: 笔记应用，本地保存笔记本、分区和页面，支持自由画布或 Markdown。
Description: |-
  Open Notition Studio 是 Open Office Studio 本地办公环境的笔记模块，无需账户或云服务。笔记本、分区和页面在本地自动保存，并支持备份。
  - 每个分区既是可以自由放置文本框的画布，也可以是带有源码编辑器、实时预览、表格和任务列表的 Markdown 页面。
  - 支持 Markdown 导入和导出。
