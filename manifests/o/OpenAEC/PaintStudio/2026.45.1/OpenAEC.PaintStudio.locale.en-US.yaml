ShortDescription: A small image editor inspired by MS Paint, with editable vector objects.
Description: |-
  OpenAEC Paint Studio is a small image editor inspired by MS Paint, using the OpenAEC application style. It runs as a Tauri 2 desktop application.
  - Smooth brush strokes, eraser, flood fill, eyedropper, lines, rectangles, ellipses and inline text editing
  - Brush size, opacity, filled or outlined shapes, a color palette, crop, resize, rotate and flip
  - Optional keep-vector mode: select, move, resize and restyle drawn shapes and text, and export editable SVG
  - Brightness, contrast, saturation, grayscale, invert and sepia adjustments; raster corrections flatten the image and undo restores the original objects
  - Opens PNG, JPEG, WebP, GIF, BMP, TIFF, HEIC/HEIF, AVIF, PSD, SVG, ICO, TGA, JPEG 2000, JPEG XL and supported camera RAW variants, plus IFCX/IFCXB raster documents; export to PNG, JPEG, WebP or SVG
  - Undo and redo, Ctrl+wheel zoom, middle-button panning, a pixel grid, local draft recovery, and Dutch and English interfaces with light, dark and high-contrast themes
