ShortDescription: 一款受画图启发、支持可编辑矢量对象的小型图像编辑器。
Description: |-
  OpenAEC Paint Studio 是一款受画图启发、采用 OpenAEC 应用风格的小型图像编辑器。它以 Tauri 2 桌面应用的形式运行。
  - 平滑笔刷、橡皮擦、油漆桶填充、取色器、直线、矩形、椭圆和内联文本编辑
  - 笔刷大小、不透明度、填充或描边形状、调色板，以及裁剪、缩放、旋转和翻转
  - 可选的保留矢量模式：选择、移动、调整大小并重新设置所绘形状和文本的样式，还可导出可编辑的 SVG
  - 亮度、对比度、饱和度、灰度、反色和深褐色调整；栅格校正会拼合图像，撤销则会恢复原始对象
  - 可打开 PNG、JPEG、WebP、GIF、BMP、TIFF、HEIC/HEIF、AVIF、PSD、SVG、ICO、TGA、JPEG 2000、JPEG XL 和受支持的相机 RAW 变体，以及 IFCX/IFCXB 栅格文档；可导出为 PNG、JPEG、WebP 或 SVG
  - 支持撤销和重做、Ctrl+滚轮缩放、鼠标中键平移、像素网格、本地草稿恢复，并提供荷兰语和英语界面以及浅色、深色和高对比度主题
