PackageIdentifier: OpenAEC.OpenFieldStudio
PackageVersion: 0.4.12
PackageLocale: zh-CN
ShortDescription: 建筑检查、能效标签调查、文物建筑检查、交付验收与质量管理。
Description: |-
  Open Field Studio 是一款免费的开源工具，用于在建筑项目上执行建筑检查、能效标签调查、文物建筑检查、交付验收和质量保证。
  - 在平面图上进行工单和缺陷登记，支持类别、优先级、状态工作流和指派
  - 基于检查清单的检查，内置 15 个模板，包括通过/不通过检查项和 NEN 2767 状况评分
  - 支持完整 NTA 8800 数据采集的能效标签调查，并可一键从 RVO EP-Online 登记系统查询能效标签
  - 覆盖建筑结构、室内、潮湿与损坏以及维护计划的文物建筑检查
  - 交付验收，附带正式证书、数字签名和文档附件
  - BAG 地址查询，并对照荷兰建筑物登记系统进行核验；IFC 查看器支持 IFC 2x3 和 IFC4 模型
  - 现场拍照，每张照片都带有拍摄时间戳和 GPS 坐标，并显示在查看器和 PDF 报告中
  - HTML 和 PDF 报告、BCF 2.1 导出、实时仪表板，以及 AFAS Profit、Exact Online、Bouw7、ERPNext、n8n webhook、Woningborg WKI、SWK 和 KYP Project 的连接器
  - 提供荷兰语、英语、德语和法语界面，布局自适应移动设备
Tags:
