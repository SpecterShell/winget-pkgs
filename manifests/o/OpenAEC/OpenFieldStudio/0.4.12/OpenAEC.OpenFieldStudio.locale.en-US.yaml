ShortDescription: Construction inspections, energy label surveys, monument inspections, handovers and quality assurance.
Description: |-
  Open Field Studio is a free, open-source tool for performing construction inspections, energy label surveys, monument inspections, handovers and quality assurance on construction projects.
  - Tickets and defect registration on floor plans with category, priority, status workflow and assignment
  - Checklist inspections with 15 built-in templates, including pass/fail checks and NEN 2767 condition scoring
  - Energy label surveys with full NTA 8800 data collection, and one-click energy label lookup from the RVO EP-Online register
  - Monument inspections covering construction, interior, moisture and damage, and maintenance plans
  - Handovers with a formal certificate, digital signatures and document attachments
  - BAG address lookup verified against the Dutch buildings registry, and an IFC viewer for IFC 2x3 and IFC4 models
  - On-site photo capture where every photo carries its capture timestamp and GPS coordinates, shown in the viewer and PDF reports
  - HTML and PDF reports, BCF 2.1 export, a real-time dashboard, and connectors for AFAS Profit, Exact Online, Bouw7, ERPNext, n8n webhooks, Woningborg WKI, SWK and KYP Project
  - Available in Dutch, English, German and French, with a mobile-responsive layout
