PackageIdentifier: OpenAEC.OpenSpreadsheetStudio
PackageVersion: 2026.46.2
PackageLocale: zh-CN
ShortDescription: 电子表格软件，直接编辑 XLSX 文件，支持公式、格式设置和 CSV/TSV 导入导出。
Description: |-
  Open Spreadsheet Studio 是 Open Office Studio 本地办公环境的电子表格模块，无需账户或云服务。它直接编辑 XLSX：公式、单元格格式、行、列和工作表、排序、填充、自动求和、冻结窗格、查找和替换。
  - 荷兰式输入（如 1,5、12,5%、€ 1.234,50 和 26-10-2026）会被识别为数字或日期。
  - 支持 CSV/TSV 导入和导出。
  - 图表（十一种类型）可插入电子表格中进行编辑。
  - 可另存为 XLSX、启用宏的变体（按原格式打开的文件）、Markdown、CSV/TSV、HTML、PNG 和 PDF；更多格式可借助已安装的 LibreOffice。
