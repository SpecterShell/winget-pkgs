ShortDescription: Spreadsheet editor that edits XLSX files directly, with formulas, formatting, charts and CSV/TSV support.
Description: |-
  Open Spreadsheet Studio is the spreadsheet module of Open Office Studio, a local office environment without an account or cloud service. It edits XLSX directly: formulas, cell formatting, rows, columns and sheets, sorting, fill, AutoSum, freeze panes, find and replace.
  - Dutch-style input such as 1,5, 12,5%, € 1.234,50 and 26-10-2026 is recognised as a number or date.
  - CSV/TSV import and export.
  - Charts (eleven types) can be inserted and edited in spreadsheets.
  - Save As to XLSX, the macro-enabled variant (for files opened as such), Markdown, CSV/TSV, HTML, PNG and PDF, with more formats available through an installed LibreOffice.
