ShortDescription: Presentation editor that edits PPTX files directly, with slides, shapes, speaker notes and a slideshow.
Description: |-
  Open Presentation Studio is the presentation module of Open Office Studio, a local office environment without an account or cloud service. It edits PPTX directly: slides, shapes, text, alignment, speaker notes, and a slideshow from the first or current slide.
  - Charts (eleven types) can be inserted and edited in presentations.
  - Save As to PPTX, the macro-enabled variant (for files opened as such), Markdown, HTML, PNG and PDF, with more formats available through an installed LibreOffice.
