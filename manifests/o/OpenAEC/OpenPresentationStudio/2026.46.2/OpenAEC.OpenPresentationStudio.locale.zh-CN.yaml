PackageIdentifier: OpenAEC.OpenPresentationStudio
PackageVersion: 2026.46.2
PackageLocale: zh-CN
ShortDescription: 演示文稿软件，直接编辑 PPTX 文件，支持幻灯片、形状、演讲者备注和放映。
Description: |-
  Open Presentation Studio 是 Open Office Studio 本地办公环境的演示模块，无需账户或云服务。它直接编辑 PPTX：幻灯片、形状、文本、对齐、演讲者备注，以及从第一张或当前幻灯片开始放映。
  - 图表（十一种类型）可插入演示文稿中进行编辑。
  - 可另存为 PPTX、启用宏的变体（按原格式打开的文件）、Markdown、HTML、PNG 和 PDF；更多格式可借助已安装的 LibreOffice。
