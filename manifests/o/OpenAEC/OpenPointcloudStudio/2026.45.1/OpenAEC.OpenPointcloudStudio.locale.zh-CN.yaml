PackageIdentifier: OpenAEC.OpenPointcloudStudio
PackageVersion: 2026.45.1
PackageLocale: zh-CN
ShortDescription: 用于查看、测量、编辑和转换激光扫描及其他点云的桌面应用，并可将点云转为断面图和网格。
Description: |-
  一款用于查看、测量、编辑和转换激光扫描及其他点云的桌面应用，并可将点云转为断面图、网格和建筑的平面表面。它运行于 Windows、Linux 和 macOS，由 Rust 编写，无需浏览器或 Web 视图。
  打开
  - 支持 LAS、LAZ、E57、PLY、PCD、PTX、PTS 和文本格式的点云，OBJ、PLY、OFF 和 STL 的网格，以及 ASCII DXF 中的点和面。
  - 一次打开整个扫描项目：文件夹中的每个受支持文件，或扫描项目文件（.rcp）所列出且位于其旁的扫描。
  - 多个文件一起打开，每个文件是一个可隐藏、显示或关闭的图层。
  - 大文件在打开过程中依然可用：LAS 和 LAZ 从文件头开始打开，512 MiB 以上的 E57 文件在布局允许时可在一秒内先显示散布全文件的采样，再由多个线程解码，完整读取的扫描会在读取过程中逐秒显示点。
  视图
  - 磁盘上的八叉树索引为当前相机提供细节，直至点预算。对一百万点以上的点云自动构建，并在下次打开文件时复用。
  - 四种颜色模式（存储颜色、高程、强度、分类）、瞳孔渲染照明，以及 0.1 到 20 的点大小。
  - 文档标签页把 3D 模型、打开的视图、图纸和图幅以及 E57 照片并排显示。
  - 扫描仪站点显示为标记；E57 文件中沿路径拍摄的全景和照片可就地查看，"照片取色"可把照片看到的颜色赋予扫描的点。
  - 使用 W、A、S、D 在场景中漫游。
  剖切框与 2D 图纸
  - 带六个可拖动面的剖切框限制显示、选择、网格化和面搜索的范围，其内容可单独导出或绘制成 2D 图纸。
  - 断面绘制按 1:1 比例绘制剖切框切出的内容，并保存为 DXF 或 DWG：平面图、立面图或垂直剖面，来自所有可见扫描。
  - 填充剖切把楼板穿过的墙、柱和楼板添加为带轮廓的填充区域，平直 CAD 线在独立图层上添加闭合、可编辑的多段线。
  - 图幅支持 A4 至 A0 横放或竖放的图纸，带边框和标题栏；把视图拖到图纸上，用文字、尺寸和引线标注，并导出为 PDF。
  编辑与测量
  - 框选、点选、可撤销的删除、抽稀、移动和缩放；这些操作都不会改动源文件，导出时写入编辑结果。
  - 在拾取的点之间测量距离和面积，以米标注。
  网格与面
  - 网格化把扫描的点（或剖切框内的部分）转换为地形网格、3D 表面、房间的闭合网格，或检测出的平面与圆柱。
  - 网格可导出为 OBJ、PLY、STL、DXF、DWG 或 IFC4，检测面可导出为 JSON、OBJ、DXF、DWG 或 IFC4。
  导出与转换
  - 把当前扫描导出为 LAS、LAZ、E57、PLY、XYZ、PTS 或 CSV；未编辑的 LAS、LAZ 或 E57 文件导出为原格式时按字节原样复制。
  - 把可见的 LAS/LAZ 扫描合并为一个文件。
  - 导出 BCF 2.1：带备注和图片的已保存视图。
  扩展与自动化
  - 每个窗口都在 127.0.0.1 上运行命令服务器。命令行提供转换、断面导出、绘图、合并、网格化和面检测等无界面模式，--mcp 则把这些命令作为 MCP 工具提供。
  - 其他作者的扩展可添加任务：一个包含 extension.json 和任意语言程序（如 PowerShell 或 Python 脚本）的文件夹或 .zip。
  - 内置扩展可为选定区域下载荷兰的建筑模型（3D BAG）并与扫描一起显示。
