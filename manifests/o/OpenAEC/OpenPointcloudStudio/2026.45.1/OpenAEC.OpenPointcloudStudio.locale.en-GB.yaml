ShortDescription: Desktop application for viewing, measuring, editing and converting laser scans and other point clouds, and turning them into section drawings and meshes.
Description: |-
  A desktop application for viewing, measuring, editing and converting laser scans and other point clouds, and for turning them into section drawings, meshes and the flat faces of a building. It runs on Windows, Linux and macOS, is written in Rust and needs no browser or web view.
  Open
  - Point clouds in LAS, LAZ, E57, PLY, PCD, PTX, PTS and text formats, meshes in OBJ, PLY, OFF and STL, and the points and faces of an ASCII DXF.
  - A whole scan project at once: every supported file in a folder, or the scans that a scan project file (.rcp) lists and that lie beside it.
  - Several files together, each as a layer that can be hidden, shown or closed.
  - Large files stay usable while they open: LAS and LAZ open from their header, an E57 file of 512 MiB or more shows a sample spread through the file within about a second when its layout allows that and is then decoded on several threads, and a scan that is read in full shows its points while it is read.
  View
  - An index on disk (an octree) supplies the detail for the current camera, up to the point budget. It is built automatically for clouds of one million points or more, and reused the next time the file is opened.
  - Four colour modes (stored colour, elevation, intensity, classification), eye-dome lighting, and a point size from 0.1 to 20.
  - Tabs put the 3D model, opened views, drawings and sheets, and E57 photos side by side.
  - Scanner stations are shown as markers; panoramas and photos taken along a path in an E57 file can be viewed in place, and colour from photos gives the points of a scan the colours its photos see them with.
  - Walk through the scene with W, A, S, D.
  Section box and 2D drawings
  - A box with six draggable faces limits what is shown, selected, meshed and searched for faces, and its content can be exported on its own or drawn as a 2D drawing.
  - Section drawing makes a 2D drawing at scale 1:1 of what the section box cuts and saves it as DXF or DWG: a plan, an elevation or a vertical section, from all visible scans.
  - Filled cut adds the walls, columns and floors that the slab goes through as filled regions with outlines, and straight CAD lines add closed, editable polylines on a layer of their own.
  - Sheets hold paper from A4 to A0 with a border and a title block; drag views onto the paper, annotate with text, dimensions and leaders, and export the sheet as a PDF.
  Edit and measure
  - Box select, point picking, delete with undo, thinning, moving and scaling; none of this changes the source file. Exports write the edited result.
  - Distance and area measuring between picked points, labelled in metres.
  Mesh and faces
  - Mesh Pointcloud turns the points of a scan, or the part of them inside the section box, into a terrain mesh, a 3D surface, a closed mesh of a room, or the detected flat faces and round columns.
  - Export meshes as OBJ, PLY, STL, DXF, DWG or IFC4, and detected faces as JSON, OBJ, DXF, DWG or IFC4.
  Export and convert
  - Export the active scan as LAS, LAZ, E57, PLY, XYZ, PTS or CSV; an unedited LAS, LAZ or E57 file exported to its own format is copied byte for byte.
  - Merge visible LAS/LAZ scans into one file.
  - Export BCF 2.1: saved views with notes and pictures.
  Extensions and automation
  - Every window runs a command server on 127.0.0.1. The command line offers headless modes for conversion, section export, drawing, merging, meshing and face detection, and --mcp serves the commands as MCP tools.
  - Extensions from other authors add tasks: a folder or .zip with an extension.json and a program in any language, such as a PowerShell or Python script.
  - A built-in extension downloads building models of the Netherlands (3D BAG) for an area and shows them with a scan.
