ShortDescription: NTA 8800 energy-performance calculation for Dutch dwellings and utility buildings.
Description: |-
  Open Energy Studio is open-source energy-performance software for buildings in the Netherlands, calculated according to NTA 8800, for both dwellings and utility buildings.
  - A deterministic Rust calculation kernel covering heat need, BENG 1/2/3, TOjuli, primary energy and the energy label; every result is stamped with the kernel version and an input fingerprint
  - Several supported norm editions: NTA 8800:2025+C1 (default and registrable) plus older editions as legacy, non-registrable calculations, with edition switch points explained in the app
  - Basisopname surveys of existing dwellings and utility buildings (ISSO 82.1/75.1) and tailored advice (ISSO 82.2/75.2) with user profiles, measure packages and NPV
  - Relabel comparisons per BRL 9500 annex 6a/6b, registration and dossier data with evidence links and a dossier ZIP with SHA-256 per file, and an EP-Online data overview
  - Energy-performance reports at summary, standard and detailed level, plus a tailored-advice report
  - Uniec 3 and VABI exchange, a local HTTP API and an MCP server, and a Tauri 2 desktop app alongside a browser build of the same interface
  - A Dutch user manual, available in the app and shipped with every release
  Open Energy Studio does not yet hold a BRL 9501 attest: results are indicative and cannot be used for an official energy label, a BENG check for a permit or registration in EP-Online.
