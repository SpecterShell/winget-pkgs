PackageIdentifier: OpenAEC.OpenEnergyStudio
PackageVersion: 26.45.0
PackageLocale: zh-CN
ShortDescription: 依据荷兰 NTA 8800 规范计算住宅和公用建筑的能耗性能。
Description: |-
  Open Energy Studio 是一款开源的建筑能耗性能计算软件，面向荷兰的建筑，依据 NTA 8800 规范进行计算，既适用于住宅，也适用于公用建筑。
  - 确定性的 Rust 计算内核，涵盖热负荷、BENG 1/2/3、TOjuli、一次能耗与能效标签；每个计算结果都带有内核版本号和输入指纹
  - 支持多个规范版本：NTA 8800:2025+C1（默认且可申报），旧版本作为遗留版本计算但不可申报，切换版本时会说明新版本拒绝或要求的调整
  - 既有住宅和公用建筑的现状测绘（ISSO 82.1/75.1），以及定制建议（ISSO 82.2/75.2），包含用户档案、实测用煤量拟合、改造措施包和净现值分析
  - 依据 BRL 9500 附件 6a/6b 的复评比对、申报与档案数据（含证据链接和逐文件 SHA-256 的档案 ZIP），以及 EP-Online 数据概览
  - 概要、标准和详细三个层级的能耗性能报告，以及定制建议报告
  - 支持 Uniec 3 和 VABI 数据交换，提供本地 HTTP API 与 MCP 服务器，并有 Tauri 2 桌面应用与同一界面的浏览器版本
  - 附带荷兰语用户手册，随每个版本一同发布
  Open Energy Studio 尚未取得 BRL 9501 认证：计算结果仅供参考，不能用于正式能效标签、许可审批所需的 BENG 核查或在 EP-Online 中登记。
