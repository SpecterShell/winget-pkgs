PackageIdentifier: OpenAEC.OpenPDFStudio
PackageVersion: 2026.46.3
PackageLocale: zh-CN
ShortDescription: 面向图纸工作者的免费开源 PDF 编辑器：批注、按比例测量、版本对比与 CAD 导入，可在桌面、Android 和浏览器上运行。
Description: |-
  Open PDF Studio 是一款面向建筑师、工程师、承包商以及所有审阅图纸和文档的人的 PDF 编辑器。你可以批注、按图纸自带的比例测量、对比修订版本、放置符号、统计数量和整理页面，无需订阅、账户，也没有水印。
  它可作为 Windows、macOS 和 Linux 桌面应用运行，也有 Android 应用，还可在浏览器中直接使用、无需安装。桌面版额外提供需要本机计算能力的功能：打印、OCR、DWG 与 DXF 导入导出、数字签名以及本地 AI 连接（MCP）。
  为什么选择它？
  - 免费开源：LGPL-3.0-or-later。无许可费用，无需账户，没有遥测，也不加水印。
  - 为图纸而生：修订云、引出标注、填充、印章和符号库，支持按比例打印最大至 A0 的图幅。
  - 立即按比例测量：自带比例的图纸（如 CAD 打印图或导入的 DWG）无需校准即可正确测量。
  - 看清变化：将两个修订版本并排或叠加对比，并列出每一处更改。
  - CAD 进出：将 DWG 和 DXF 导入为带图层和测量比例的矢量 PDF，并可将页面导回 DXF 或 DWG（桌面版）。
  - 与 AI 助手协作：内置 94 个工具的本地 MCP 服务器，可让助手为你打开、批注、测量和保存文档（桌面版）。
  - 随处可用：Windows、macOS、Linux、Android 和浏览器，支持 40 种语言。
  批注与测量
  - 批注：高亮、形状、修订云、引出标注、文本框、便签、手绘、印章、图片和签名，带样式、图层和对齐工具。
  - 测量：距离、面积、周长和角度，按图纸中的比例或你校准的比例，并可吸附到图纸。
  - 数量统计：按类别数对象，把数量、长度和面积汇总成一张表格，放在页面上或导出为 CSV。
  - 涂黑：把标记区域下的文字、图片和矢量内容从文件中移除，而不只是从视图上隐藏。
  文档与页面
  - 页面：插入、删除、提取、拆分、旋转、排序和合并；拉直倾斜的扫描件或移动页面内容。
  - 表单、书签和附件：填写并创建表单域，编辑书签，管理附件。
  - 水印、页眉和页脚，带页码和日期。
  - 在页面文本和批注中搜索，并按页显示结果列表。
  桌面版功能
  - CAD：导入带图层、视口和测量比例的 DWG 与 DXF，并将页面导出为 DXF 或 DWG。
  - 打印：在大图幅上按比例打印，带实时预览和"另存为 PDF"。
  - OCR：让扫描件可以搜索。
  - 数字签名：带证书链的签名验证，以及签署文件。
  互操作性
  可打开 PDF（含表单和图层）、XFDF 批注、BCF 2.1 问题、DWG 与 DXF（桌面版）以及 PNG/JPEG 图片；可导出 PDF/A、PDF/X、栅格 PDF、扁平化副本、XFDF、BCF、DXF、DWG、IFCX（IFC5 JSON，测试版）、DOCX、ODT、XLSX、CSV 和图片。
  MCP
  桌面应用内置 MCP 服务器，AI 助手可以在你的文档上工作：打开和保存文件、翻页浏览、创建和编辑批注、设置测量比例、统计工程量、导入导出 CAD，以及打印为 PDF 文件。共有 94 个公开工具。
  一切尽在掌握。新安装时服务器默认开启，只监听你自己的计算机（127.0.0.1，端口 9223）；可在"设置 > 常规"中关闭它或更改端口。状态栏会显示助手何时连接以及最后使用了哪个工具。
  底层实现
  应用是一款 Tauri 2 桌面应用，后端为 Rust，前端为 SolidJS。页面通过多进程 PDFium 工作线程池渲染，脱离 UI 线程并与崩溃隔离，对超大图纸采用渐进式分块。PDF 变更由 pdf-lib 写入。
