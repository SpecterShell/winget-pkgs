ReleaseNotes: |-
  🇬🇧 English
  What's New in v2026.46.3
  New
  - Own markup statuses: define statuses with your own name and colour under Preferences → Annotations → Comments, such as "Approved" or "In progress". They appear next to the standard statuses in the Status menu, the markups list and the filter, and are saved in the PDF.
  - Show only open items: one click in Show → Status hides every finished markup, in the list and on the drawing.
  - Page scale per page: each thumbnail shows the scale of its page; click it to set it, also for several pages at once. Detect scales from the page text or from an area in the title block, with progress and Cancel. The scale is saved in the PDF and moves with its page.
  - Reverse the mouse wheel zoom direction under Preferences → Behaviour → Navigation.
  - Central documents (first step): sign in to your own collaboration server through File → Central documents, upload and share PDFs, and open a snapshot.
  - Extensions can follow a selection of several markups.
  Fixed
  - The OpenAEC Installer no longer opens when you start the app.
  - Filled-in forms print with their values, also with Save as PDF.
  - A rotated page no longer turns upside down when zooming after a save.
  - Fonts from a font collection (such as MS Gothic) are embedded correctly, so the text looks the same in other programs.
  - Headers and footers are no longer doubled on a rotated document after saving.
  - A status with accents comes back correctly after reopening; the "Reviewed" status can be filtered too.
  Free, open-source PDF annotation editor built with Tauri.
