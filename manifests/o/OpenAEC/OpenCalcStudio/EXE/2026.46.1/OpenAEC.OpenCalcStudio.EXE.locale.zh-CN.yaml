ShortDescription: 面向桌面、浏览器与嵌入式使用的开源建筑工程造价估算：编制估算书、导入电子表格/PDF/IFC 工程量、核对来源与价格并生成报表。
Description: |-
  面向桌面、浏览器和嵌入式应用的开源建筑工程造价估算工具。
  编制估算，导入电子表格/PDF/IFC 工程量，核对来源与价格，并准备报表。可以使用完整编辑器，也可以跟随引导式流程，两者作用于同一个项目。
  功能
  - 可导航的结构树，带同步选择、拖放、右键菜单移动和深度控制。
  - 每份估算独立的币种和明确的数字表示；更改币种永远不会换算金额。
  - 共享 OpenAEC IFCX 导入，保留模型引用、来源单价和取整金额，同时防止交换源文件被原生覆盖。
  - 分级估算：章、费用项、生产定额、小时费率、资源分类、间接费、利润、混合增值税和取整。
  - 可编辑网格、电子表格、变体、快照、报表、来自 IFC-Lite 的工程量以及持久化的 PDF 测量。
  - 通用 Excel/CSV 列映射，包括西班牙语表头、层级章代码和人工/材料/机械费用拆分。
  - 定额价来源追溯、选择性价格更新和来源版本比对（可撤销）；多文档恢复以及带前版本备份的原生保存。
  - 可选的五步"估算向导"，与编辑器共用项目和计算器，可直接返回完整编辑器。
  - "Prompt & Begroot"（提示与估算）带金额预览、变更行明细和假设条件；可将完整提案作为单一事务批准或撤销。
  - 保存测量、估算和复核的任务工作区，包括面板宽度、缩放和列。可在同步的只读第二屏幕上打开 PDF 图纸或工程量来源。
  - 从 PDF、IFC 或电子表格来源追溯工程量出处，保存来源标识、页码/对象引用、计算过程以及缺失来源/单位警告。
  - 侧边栏的"复核中心"：对当前变体进行实时的价格、来源和单位检查，带类别筛选、精确行定位和返回按钮。也可在移动端、通过桌面 MCP 以及纯 SDK 函数 reviewBudget 使用。
  - 原生 .ifcCalc、BC3、ÖNORM A 2063、CUF/RSX 和 IFC 的导入导出；支持荷兰传统工具、GAEB、IBIS-TRAD 和电子表格的导入。
  - 带持久导航、项目页眉和实时估算合计的工作区，使用官方 OpenAEC Blueprint 字体排印、本地字体和五套主题。
  - 托管平台构建支持可选的 window.openaecHost 存储、文件版本和冲突保护；该构建不含自有账户、用户扩展或个人 AI 密钥。
  - React/JavaScript SDK、隔离 iframe 嵌入、独立 stdio MCP、桌面自动化 API，以及单独的经身份验证的无头 REST/HTTP-MCP 计算服务。
