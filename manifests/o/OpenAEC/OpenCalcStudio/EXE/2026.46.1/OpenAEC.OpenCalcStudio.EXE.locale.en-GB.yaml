ReleaseNotes: |-
  - #80: PDFs load again in the web version. The PDF.js worker is emitted as .js instead of .mjs, which web servers without .mjs in their MIME table served as application/octet-stream ("Setting up fake worker failed").
  - Variants (knownbugs 12, 264): grid, status bar, tail/hours panels, header, summary, structure tree, mobile and wizard total only the active variant. The review centre uses the same totals.
  - Review centre (knownbugs 11, 13, 14): a post with only empty rows is flagged as missing a price; empty rows under a post whose own price carries the total are not; a rate group without a rate does not count as a price.
  - #69: Calc writes the shared openaec::cost::estimateItem profile (IFC data → Download (OpenAEC IFCX), or MCP export_ifcx with profile: "openaec") and reads free items with an inline quantity. Proposed shared contract in the IFCX profile document; the full Calc IFCX export is unchanged.
  Upgrade note: in estimates that use variants, displayed totals can be lower than in 2026.46.0, because rows of variants you did not choose no longer count. Without variants nothing changes. Reports and printing still include all variants (knownbug 165).
