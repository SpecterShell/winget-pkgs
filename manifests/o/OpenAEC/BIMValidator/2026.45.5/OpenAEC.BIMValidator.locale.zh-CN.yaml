PackageIdentifier: OpenAEC.BIMValidator
PackageVersion: 2026.45.5
PackageLocale: zh-CN
ShortDescription: 浏览器版 IFC 验证工具，可依据 IDS 规范（NL-BIM、RVB）验证模型，支持 3D 查看和 BCF 导出。
Description: |-
  在 3D 中检查 IFC 模型，依据 IDS 要求验证其信息，并将发现导出为 BCF。
  OpenAEC BIM Validator 结合了 React 查看器、独立的 Python 验证库、命令行工具、FastAPI 服务器和 Windows Tauri 外壳。模型验证基于 IfcOpenShell 和 ifctester。浏览器查看器在本地显示模型；服务器验证会将模型上传到所配置的后端。
  Windows 版本以 Tauri NSIS 安装程序发布，内嵌 Python 服务器、WebView2 引导程序和加载器 DLL。
  支持的格式和接口：
  - IFC2X3/IFC4 STEP（.ifc），用于模型查看和 IDS 验证
  - IDS XML（.ids），用于自定义或内置的信息要求
  - JSON 和 HTML，用于 CLI 验证报告
  - BCF 2.1，用于导入、打开视点、编辑状态和再次导出
  - HTTP，用于上传、验证任务、轮询和 BCF 下载
  打开 BCF -> Import BCF 即可加载 .bcf 或 .bcfzip 文件（压缩后最大 50 MB，展开后最大 100 MB）。选中问题后，其相机、构件选择和可见性会应用到已加载的模型。重新导入同一主题 ID 不会覆盖本地问题，导出会保留主题 ID、作者、原始评论、视点和图像。本地问题队列仅保留在当前会话中：关闭应用前请先导出更改。
  内置的 nl-bim 和 rvb IDS 文件是项目维护方对标准的解释。通过验证并不代表满足源标准的每一项要求，IDS 之外的要求需要另行评估。
