ReleaseNotes: |-
  New in this version
  - OpenAEC Blueprint UI 0.4 with five themes, shared React controls, native dialogs, B2 icons, and locally bundled fonts.
  - Import BCF 2.1 files into the issue queue, open viewpoints, change status, and export again.
  - Topic IDs, authors, original comments, camera files, and images are preserved; importing the same file twice does not overwrite local issues.
  - Restored BCF 2.1 XML structure, orthographic zoom, visibility reset, and Escape handling for stacked dialogs.
  - README updated in Dutch and English, source verification for Blueprint in CI, and adapted Docker and licensing packaging.
  Verification
  193 frontend tests and a production build; the full Python test matrix on 3.11 and 3.12 in PR #26. Browser import, status changes, and export were checked against the official BCF 2.1 markup and viewpoint schemas. The container starts locally as non-root with a passing healthcheck.
  The Windows app, bundled server, and installer are signed by the release workflow and verified including timestamps. The installer contains the WebView2 bootstrapper and WebView2Loader.dll. Use SHA256SUMS and GitHub artifact attestations to verify downloads.
  Open items
  BCF API 3.0/OAuth2 synchronization with external servers, display of additional viewpoints, and imported clipping planes remain open in #18. Other roadmap items are tracked in docs/release-plan.md; this release does not automatically close them.
