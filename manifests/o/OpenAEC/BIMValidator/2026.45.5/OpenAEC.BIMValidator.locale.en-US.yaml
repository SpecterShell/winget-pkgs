ShortDescription: Browser-based IFC validation tool for IDS specifications (NL-BIM, RVB) with 3D viewing and BCF export.
Description: |-
  Inspect IFC models in 3D, validate their information against IDS requirements, and export findings as BCF.
  OpenAEC BIM Validator combines a React viewer, a standalone Python validation library, a command-line tool, a FastAPI server and a Windows Tauri shell. Model validation uses IfcOpenShell and ifctester. The browser viewer displays models locally; server validation uploads the model to the configured backend.
  The Windows release is a Tauri NSIS installer with an embedded Python server, a WebView2 bootstrapper and loader DLL.
  Supported formats and interfaces:
  - IFC2X3/IFC4 STEP (.ifc) for model viewing and IDS validation
  - IDS XML (.ids) for custom or bundled information requirements
  - JSON and HTML for CLI validation reports
  - BCF 2.1 for import, opening viewpoints, editing status, and exporting again
  - HTTP for upload, validation jobs, polling, and BCF download
  Open BCF -> Import BCF to load a .bcf or .bcfzip file (maximum 50 MB compressed, 100 MB expanded). Selecting an issue applies its camera, component selection, and visibility to the loaded model. Reimporting an existing topic ID does not overwrite local issues, and export retains topic IDs, authors, original comments, viewpoints, and images. The local issue queue lasts for the current session: export changes before closing the app.
  The bundled nl-bim and rvb IDS files are project-maintained interpretations. Passing them does not establish compliance with every requirement of the source standards. Requirements outside IDS need separate assessment.
