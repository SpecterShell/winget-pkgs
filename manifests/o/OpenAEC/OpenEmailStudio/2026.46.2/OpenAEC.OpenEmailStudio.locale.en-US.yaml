ShortDescription: Standalone IMAP/SMTP email client with folders, search, drafts, OAuth2 sign-in and attachment previews.
Description: |-
  Open Email Studio is the email module of Open Office Studio: a standalone IMAP/SMTP email client with folders, search, reply, reply all, forward, drafts and attachments. Everything runs locally; there is no account and no cloud service.
  - When you add an account, it suggests server settings from a built-in provider list, your domain's autoconfig, DNS (SRV/MX) and a connection test. Looking up Mozilla's Thunderbird database is optional and off by default.
  - Sign in with Microsoft or Google via OAuth2 (PKCE, system browser). This needs an OAuth client ID that you configure yourself.
  - Attachment previews; Office attachments open as an editable copy in Writer, Spreadsheet or Presentation, MDB/ACCDB in Database Studio.
  - HTML mail is shown sanitised in a sandboxed frame; external images are blocked until you allow them.
  - Passwords and OAuth refresh tokens are stored in the operating system's keychain.
