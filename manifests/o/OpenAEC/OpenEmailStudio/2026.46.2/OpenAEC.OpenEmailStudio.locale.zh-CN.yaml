PackageIdentifier: OpenAEC.OpenEmailStudio
PackageVersion: 2026.46.2
PackageLocale: zh-CN
ShortDescription: 独立的 IMAP/SMTP 电子邮件客户端，支持文件夹、搜索、草稿、OAuth2 登录和附件预览。
Description: |-
  Open Email Studio 是 Open Office Studio 的电子邮件模块：一个独立的 IMAP/SMTP 电子邮件客户端，支持文件夹、搜索、回复、全部回复、转发、草稿和附件。一切都在本地运行；没有账户，也没有云服务。
  - 添加账户时，它会通过内置服务商列表、域名的 autoconfig、DNS（SRV/MX）和连接测试推荐服务器设置。查询 Mozilla Thunderbird 数据库为可选项，默认关闭。
  - 通过 OAuth2（PKCE、系统浏览器）登录 Microsoft 或 Google。这需要你自己配置 OAuth 客户端 ID。
  - 附件预览；Office 附件可在 Writer、Spreadsheet 或 Presentation 中作为可编辑副本打开，MDB/ACCDB 可在 Database Studio 中打开。
  - HTML 邮件在沙盒框架中净化显示；在你允许之前，外部图片会被阻止。
  - 密码和 OAuth 刷新令牌保存在操作系统的密钥链中。
