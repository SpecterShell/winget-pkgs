PackageIdentifier: OpenAEC.OpenDatabaseStudio
PackageVersion: 2026.46.2
PackageLocale: zh-CN
ShortDescription: 无需 Access 即可打开 Microsoft Access MDB 和 ACCDB 文件，在可编辑的 SQLite 工作副本中操作。
Description: |-
  Open Database Studio 无需 Access 即可打开 Microsoft Access MDB 和 ACCDB 文件，是本地 Open Office Studio 环境的一部分。经过只读分析后，它会生成可编辑的 SQLite 工作副本；原始文件绝不会被修改。
  - 表（网格和设计视图）、保存的查询和 Access-SQL 编辑器、简单窗体和报表，以及每个文件的兼容性报告。
  - VBA 仅在你明确许可后，在自带沙盒解释器（含 DAO 子集）中运行。任何内容都不会自动运行（无 AutoExec）。Access 窗体设计和宏仅被清点，不会执行。
  - 将工作副本保存为 .sqlite；将表和查询结果导出为 CSV，源导出为 SQL 或 BAS，报表导出为 JSON 或文本。
  - 可在 Open Office Studio 套件内使用，也可作为独立桌面应用使用。
