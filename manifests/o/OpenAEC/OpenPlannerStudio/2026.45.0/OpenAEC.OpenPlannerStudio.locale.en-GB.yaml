ReleaseNotes: |-
  - After Calculate (F5), see which tasks moved, how the project finish changed and the reason for each shift. Open the Shifts panel or restore the dates from before the calculation.
  - Progress sheets now compare the returned Excel file with both its export snapshot and your current plan. Resolve conflicting changes before applying them, and use the new Progress curve report to compare planned and actual progress. Reports now offer four bundled fonts.
  - Export Primavera P6 XER experimentally, with explicit notices about data that cannot be preserved. P6 XML uses the P6 scheduling profile and reports export losses more clearly; IFC remains the native save format.
  - One Claude Desktop extension works with the running app or starts its own planner in your chosen working folder. Copy the setup prompt from Help or Connection details; switching planners protects unsaved work and requires a document choice. Embedded planners also follow the site's language, theme and settings and support its assistant.
  - A neutral grey workspace, the approved Open Planner Studio logo and clearer baseline overlays improve readability. Choose your critical-path colours, and select hammock and summary-task names directly while they remain readable near the right edge. macOS gains native window controls and menus; Linux AppImages include IBus and Fcitx input-method modules. United States federal holidays are now available in the calendar generator. Open files by dropping them into the window and let table columns fit their contents.
  - Fixes improve milestone dragging, remaining duration, percentage lag, night shifts, resource levelling, recovery before updates, reopening recent files and menu or table input. Review new versions of external project sources before accepting anchor changes, choose source files in the browser or on the site, and find dependent projects. Update every workstation before exchanging files with v2026.9.0 or older, which can lose calendar details or time-based task durations.
