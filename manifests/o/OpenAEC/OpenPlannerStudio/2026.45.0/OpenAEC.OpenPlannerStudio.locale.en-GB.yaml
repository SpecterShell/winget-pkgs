ShortDescription: Free open-source construction scheduling app with Critical Path Method, MS Project and Primavera P6 file support, and native IFC 4.3 saves.
Description: |-
  Open Planner Studio (OPS) is a free scheduling application for the construction industry. It calculates a schedule with the Critical Path Method, opens and writes the file formats planners already use, and saves in IFC 4.3, the open building standard.
  It runs in your browser with nothing to install, or as a small native desktop app on Windows, macOS and Linux.
  Why use it?
  - Free and open. LGPL-3.0. No licence fees, no account, no lock-in.
  - Open formats. IFC 4.3 is the native project format. There is no private binary format.
  - Works with your existing files. Open Microsoft Project (.mpp, .xml) and Primavera P6 (.xer, .xml) files, and export to MS Project XML, P6 XML and CSV.
  - Scheduling rules you can choose. Calculate with Primavera P6, Microsoft Project or Open Planner Studio conventions, per project.
  - Built for construction. Public holidays, building-trade holidays, work calendars, inspection milestones, phasing, resource levelling.
  - MCP. A built-in MCP server lets an AI assistant read and edit your schedule, with safety switches you control.
  - Multilingual. 28 languages, including right-to-left Arabic and Persian.
  Advanced scheduling
  - Critical Path Method with total, free and interfering float, negative float, and a recalculation you trigger yourself (or switch to automatic).
  - All eight constraint types: As Soon As Possible, As Late As Possible, Start/Finish No Earlier Than, Start/Finish No Later Than, Must Start On, Must Finish On (optionally mandatory, "pin logic"), plus task deadlines.
  - All four relationship types (FS, SS, FF, SF) with positive and negative lag, in days or hours.
  - Hammock tasks (level of effort) that follow the work they hang on.
  - Near-critical tasks with a threshold you set, and multiple float paths to see more than the single longest chain.
  - Calculation profiles. Three built-in profiles: Open Planner Studio, Primavera P6 and Microsoft Project. A profile is a set of conventions for the places where the two products calculate differently.
  - Task types (work rules). Choose fixed duration and units, fixed duration and work, fixed work or fixed units per task.
  - Work breakdown structure, baselines, progress and status date, task splitting in the Gantt, resource levelling and a cross-project occupancy view.
  Interoperability
  IFC 4.3 ADD2 is the default native format, written as schema-valid IFC. Every other format is an adapter: open MS Project XML (MSPDI), MS Project .mpp (2010 to 2021, read-only), Primavera P6 XML and .xer (read-only) and CSV, and export to MS Project XML, P6 XML and CSV. IFC is the only format you save to; it carries the whole project. The original .xer is kept inside the saved IFC. Progress can also go through a spreadsheet: export a progress sheet (.xlsx), fill it in on site, and read it back into the open project.
  Reporting
  Eleven report types, with a live preview, exported to PDF (A4 to A1): Gantt chart, Resource diagram, Milestone overview, Variance, Look-ahead, Critical and near-critical, Progress report, Schedule health, Resource loading, Resource assignments, WBS summary. Schedule health includes a DCMA 14-point check. Reports can cover a reporting period, compare against a baseline and follow the filter and grouping of your screen.
  MCP
  OPS can run a local MCP server (Model Context Protocol) so that an AI assistant works with the schedule you have open. It offers 41 planner_* tools to read and change tasks, relations, resources, calendars, baselines and documents. You decide what the assistant may do: pause, read-only mode, automatic backups and an activity log are on the AI tab. The server is off by default and runs in the desktop app only.
  Under the hood
  The desktop app is built with Tauri 2, so the installers are small and use the web view of the system. The scheduling engine is written in TypeScript. It is the same code in the browser and on the desktop. The user interface is React 19, and the Gantt timeline is drawn on a Canvas 2D surface.
