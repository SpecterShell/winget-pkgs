ShortDescription: 本地办公套件，直接打开和保存 Word、Excel 和 PowerPoint 文件，并包含笔记、数据库和电子邮件模块。
Description: |-
  Open Office Studio 是适用于 Windows、macOS 和 Linux 的本地办公环境。它可以直接打开和保存 Word、Excel 和 PowerPoint 文件，将旧的 Microsoft Access 数据库作为可编辑副本打开，并包含笔记模块和电子邮件客户端。一切都在你自己的电脑上运行；没有账户，也没有云服务。
  套件保留全部模块：Writer（文档）、Spreadsheet（电子表格）、Presentation（演示）、Notes（笔记）、Database Studio（数据库）和 Email Studio（电子邮件）。它们在同一窗口中以文档标签页形式打开，桌面上还可以把标签页拖出为独立窗口。
  - 每个模块支持约十五种格式的另存为。应用本身直接写出 DOCX/XLSX/PPTX、启用宏的变体（按原格式打开的文件）、Markdown、CSV/TSV、HTML、PNG 和 PDF。OpenDocument（ODT/ODS/ODP）、旧版 Office 格式（DOC/XLS/PPT）、模板、RTF 和 EPUB 需要借助已安装的 LibreOffice，桌面应用会自动找到它并以禁用宏的方式运行。LibreOffice 不随应用附带。
  - 图表（十一种类型）可插入文档、电子表格和演示文稿中进行编辑。
  - 拼写检查支持荷兰语、英语（英国）和英语（美国），使用 Hunspell 词典，提供波浪线标记、建议、F7 对话框和自动更正。
  - 打印预览、文档缩放、可折叠功能区、浅色与深色主题、最近文件和自动崩溃恢复。
  - 无遥测。密码和 OAuth 刷新令牌保存在操作系统的密钥链中。
