ShortDescription: Local office suite that opens and saves Word, Excel and PowerPoint files, with notes, database and email modules.
Description: |-
  Open Office Studio is a local office environment for Windows, macOS and Linux. It opens and saves Word, Excel and PowerPoint files directly, opens old Microsoft Access databases as an editable copy, and includes a notes module and an email client. Everything runs on your own computer; there is no account and no cloud service.
  The suite retains all modules: Writer for documents, Spreadsheet, Presentation, Notes, Database Studio and Email Studio. They open in document tabs in one window, and on the desktop you can drag a tab out into its own window.
  - Save As in about fifteen formats per module. The app itself writes DOCX/XLSX/PPTX, the macro-enabled variants (for files opened as such), Markdown, CSV/TSV, HTML, PNG and PDF. OpenDocument (ODT/ODS/ODP), older Office formats (DOC/XLS/PPT), templates, RTF and EPUB use an installed LibreOffice, which the desktop app finds by itself and runs with macros disabled. LibreOffice is not bundled.
  - Charts (eleven types) can be inserted and edited in documents, spreadsheets and presentations.
  - Spell checking for Dutch, English (UK) and English (US) with Hunspell dictionaries, wavy underlines, suggestions, an F7 dialog and autocorrect.
  - Print preview, document zoom, a collapsible ribbon, light and dark app themes, recent files and automatic crash recovery.
  - No telemetry. Passwords and OAuth refresh tokens are stored in the operating system's keychain.
