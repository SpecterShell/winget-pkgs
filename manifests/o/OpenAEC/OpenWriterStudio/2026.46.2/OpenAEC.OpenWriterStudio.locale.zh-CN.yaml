PackageIdentifier: OpenAEC.OpenWriterStudio
PackageVersion: 2026.46.2
PackageLocale: zh-CN
ShortDescription: 文字处理软件，直接编辑 DOCX 文档，支持页面视图、样式、批注和修订。
Description: |-
  Open Writer Studio 是 Open Office Studio 本地办公环境的文档模块，无需账户或云服务。它直接编辑 DOCX，提供页面视图、标尺、功能区以及与常见办公套件一致的键盘快捷键。
  - 段落和字符格式、样式与样式编辑器、列表、边框和底纹、表格和图片。
  - 页眉和页脚、页码、分节和分栏、目录、脚注和尾注、水印。
  - 批注、修订，以及两个文档版本的比较。
  - 查找和替换、定位、字数统计、文档属性和阅读模式。
  - 图表（十一种类型）可插入文档中进行编辑。
