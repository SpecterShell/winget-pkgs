ShortDescription: Word processor that edits DOCX documents directly, with a page view, styles, comments and track changes.
Description: |-
  Open Writer Studio is the document module of Open Office Studio, a local office environment without an account or cloud service. It edits DOCX directly, with a page view, rulers, a ribbon and keyboard shortcuts that follow common office suites.
  - Paragraph and character formatting, styles with a style editor, lists, borders and shading, tables and images.
  - Headers and footers, page numbers, sections and columns, a table of contents, footnotes and endnotes, watermarks.
  - Comments, track changes, and comparing two versions of a document.
  - Find and replace, Go to, word count, document properties and a reading mode.
  - Charts (eleven types) can be inserted and edited in documents.
