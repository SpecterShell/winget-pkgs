ReleaseNotes: |-
  New installers for all seven apps, updated from 2026-W46.1.
  Changes since 2026-W46.1
  - Presentation: preserve manually paused media (#336).
  - Presentation: keep asynchronous poster captures attached to the correct media (#345).
  - Presentation: refuse incomplete searches when results are truncated (#339).
  - Office: restore editor focus after switching tabs with the mouse (#340).
  - Writer: preserve internal destinations in exported PDFs (#338).
  - Spreadsheet: use the updated app logo.
  These fixes were integrated in PR #348. Each app has a separate installer and profile.
  Scope and limitations
  This is a development release of the existing Tauri/React apps. macOS downloads support Apple Silicon; no separate Intel build is included. Older file formats may still require a local conversion program. The parallel native UI migration (#116), converter bundling (#317), performance candidate (#349) and in-progress issue bundle (#350) are excluded. Drawing-module research does not add a drawing editor.
  Source: cf65adf4b2ca76e4affd89f6f8812bfa4b8bec67; version PR #351. Build, signing and package verification.
