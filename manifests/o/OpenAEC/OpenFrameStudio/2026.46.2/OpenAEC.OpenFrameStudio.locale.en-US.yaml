PackageIdentifier: OpenAEC.OpenFrameStudio
PackageVersion: 2026.46.2
PackageLocale: en-US
ShortDescription: 'Open-source window-frame design for the Dutch construction sector: a 2D frame editor, a profile editor and IFC4 exchange (beta).'
Description: |-
  Open Frame Studio is a desktop app for drawing, documenting and exchanging window frames. The Rust core is shared with a limited browser variant. This beta version is a development stage for design and BIM exchange trials: it is not a validated package for manufacturer calculations, norm declarations or machine control.
  - A 2D frame editor with grid divisions, dimension lines and panel types (glass, window, door, panel, spandrel)
  - An interactive profile editor for drawing cross-sections point by point, with mirroring, grid snapping and undo/redo
  - A template library including tilt-and-turn windows, double tilt-and-turn windows, sliding doors and front doors
  - A profile library with sample profiles for wood, aluminum, PVC and wood-aluminum
  - A 3D preview with frame extrusion and transparent glass panels
  - IFC4 exchange (beta) for a single frame, project frames and a parts project, with an indicative IFC/JSON/CSV transfer package for manufacturers
  - DXF export with dimension lines, a PDF frame schedule and A3 workshop drawings
  - Sending frames to Blender for IFC modeling
  - An optional AI configurator assistant via an OpenAI-compatible API
