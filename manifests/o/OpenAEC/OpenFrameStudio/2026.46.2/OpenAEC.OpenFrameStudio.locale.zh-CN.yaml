PackageIdentifier: OpenAEC.OpenFrameStudio
PackageVersion: 2026.46.2
PackageLocale: zh-CN
ShortDescription: 面向荷兰建筑行业的开源窗框设计：2D 窗框编辑器、型材编辑器和 IFC4 交换（测试版）。
Description: |-
  Open Frame Studio 是一款用于绘制、记录和交换窗框的桌面应用。其 Rust 核心与一个功能有限的浏览器版本共用。此测试版是用于设计和 BIM 交换试验的开发阶段版本：它不是经过验证的软件包，不能用于生产商计算、规范声明或机器控制。
  - 2D 窗框编辑器，支持分格划分、尺寸标注线和分格类型（玻璃、窗、门、板件、窗下墙板）
  - 交互式型材编辑器，可逐点绘制截面，支持镜像、栅格吸附和撤销/重做
  - 模板库，包括内开内倒窗、双扇内开内倒窗、推拉门和入户门等
  - 型材库，提供木材、铝、PVC 和木铝复合的示例型材
  - 3D 预览，支持窗框拉伸和透明玻璃面板
  - IFC4 交换（测试版）：支持单个窗框、项目窗框和零件项目，并附带面向生产商的指示性 IFC/JSON/CSV 传输包
  - DXF 导出（含尺寸标注线）、PDF 窗框清单和 A3 车间图纸
  - 可将窗框发送到 Blender 进行 IFC 建模
  - 通过 OpenAI 兼容 API 使用可选的 AI 配置助手
