ShortDescription: 'Open-source kozijnontwerp voor de Nederlandse bouw: 2D-kozijneditor, profieleditor en IFC4-uitwisseling (bèta).'
Description: |-
  Open Frame Studio is een desktopapp voor het tekenen, documenteren en uitwisselen van kozijnen. De Rust-kern wordt gedeeld met een beperkte browservariant. Deze bètaversie is een ontwikkelstand voor ontwerp- en BIM-uitwisselproeven: geen gevalideerd pakket voor producentencalculatie, normverklaringen of machineaansturing.
  - 2D-kozijneditor met rasterverdeling, maatlijnen en vaktypen (glas, raam, deur, paneel, borstwering)
  - Interactieve profieleditor voor het punt-voor-punt tekenen van doorsneden, met spiegelen, rastermagnetisme en ongedaan maken/opnieuw
  - Sjabloonbibliotheek met onder andere draaikiepraam, dubbel draaikiepraam, schuifpui en voordeur
  - Profielbibliotheek met voorbeeldprofielen voor hout, aluminium, PVC en hout-aluminium
  - 3D-voorbeeld met kozijnextrusie en transparante glaspanelen
  - IFC4-uitwisseling (bèta) voor een los kozijn, projectkozijnen en een onderdelenproject, met een indicatief IFC/JSON/CSV-overdrachtspakket voor producenten
  - DXF-export met maatlijnen, PDF-kozijnstaat en A3-werkplaatstekeningen
  - Verzenden van kozijnen naar Blender voor IFC-modellering
  - Optionele AI-configuratorassistent via een OpenAI-compatibele API
