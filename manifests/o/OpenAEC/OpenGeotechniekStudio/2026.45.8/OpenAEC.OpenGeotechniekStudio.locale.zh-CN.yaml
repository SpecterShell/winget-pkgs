PackageIdentifier: OpenAEC.OpenGeotechniekStudio
PackageVersion: 2026.45.8
PackageLocale: zh-CN
ShortDescription: 读取荷兰静力触探（CPT）和钻孔数据，将其标注在地图上，并生成报告和概念桩计算。
Description: |-
  Open Geotechniek Studio 是一款面向荷兰岩土工程师和咨询顾问的桌面应用。它可以读取静力触探数据（CPT，GEF 和 BRO-XML 格式）和钻孔数据（BRO BHR-GT），在地图上从国家地下登记系统获取这些数据，将其布置到场地图上，并生成 PDF 报告和概念桩计算。
  - CPT 图表：沿 m NAP 深度绘制锥尖阻力、侧摩阻力、摩阻比和孔隙水压力，并带有指示性土层分区
  - 基于 PDOK 底图、航空影像、BAG 建筑、地籍地块和高程数据的地图与场地图；可按可视范围加载 BRO CPT 和钻孔数据
  - 在 CPT 之间插值的三维土层模型，可显示持力层顶面、桩端和剖面图，并支持 PNG 导出
  - 整个场地勘察的 IFC5（IFCX）导出，在 RD、NAP 和 WGS84 坐标系中进行地理配准
  - 单桩承载力、承载力表格和水平受荷桩的概念桩计算；每次计算都在输入旁显示其公式、代入值和结果
  - 采用 OpenAEC 统一风格的 PDF 报告、供 AI 助手使用的 MCP 服务器，以及以单个可读 .ifcgeo 文件存储的项目
  这些计算属于概念性质：结果仅供参考，屏幕上和每份 PDF 中都带有概念标记；它们不能替代经过复核的设计。
