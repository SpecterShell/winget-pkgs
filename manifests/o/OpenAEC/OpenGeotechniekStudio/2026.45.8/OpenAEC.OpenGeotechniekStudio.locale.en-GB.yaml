ShortDescription: Reads Dutch CPTs and boreholes, maps them and produces reports and concept pile calculations.
Description: |-
  Open Geotechniek Studio is a desktop app for geotechnical engineers and consultants in the Netherlands. It reads CPTs (GEF and BRO-XML) and boreholes (BRO BHR-GT), fetches them from the national subsurface register on a map, places them on a site plan, and produces PDF reports and concept pile calculations.
  - CPT chart with cone resistance, sleeve friction, friction ratio and pore pressure against depth in m NAP, with indicative soil zones
  - Map and site plan on PDOK background maps, aerial photos, BAG buildings, cadastral parcels and elevation; BRO CPTs and boreholes can be loaded for the visible area
  - 3D soil model interpolated between CPTs, with the top of the bearing layer, pile toes, sections and PNG export
  - IFC5 (IFCX) export of the whole site investigation, georeferenced in RD, NAP and WGS84
  - Concept pile calculations for bearing capacity of a single pile, capacity tables and laterally loaded piles; every calculation shows its formula, the filled-in values and the outcome next to the input
  - PDF reports in the OpenAEC house style, an MCP server for AI assistants, and projects stored as one readable .ifcgeo file
  The calculations are concept: they are indicative and carry a concept mark on screen and in every PDF; they do not replace a checked design.
