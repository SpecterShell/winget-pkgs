ShortDescription: Open-source local speech-to-text for real-time voice input in any application.
Description: |-
  Open Speech Studio is an open-source speech recognition application that runs entirely locally - a local AI alternative to Wispr Flow. All speech recognition runs on your own computer: no cloud, no subscription, full privacy. It is part of the OpenAEC Foundation.
  Features:
  - 100% local: all speech recognition runs on your own computer.
  - GPU and CPU: works on GPU (CUDA/Vulkan) and CPU, so you can choose the model that fits your hardware.
  - Multilingual: supports 99+ languages with automatic language detection.
  - Dictionary: add your own words, names and jargon for better recognition.
  - Universal speech: works in any application via a global hotkey (Ctrl+Shift+Space by default).
  - Online meetings: records your microphone and your PC audio together, so everyone in a Teams, Zoom or Meet call ends up in the transcript (Windows only).
  Download a speech model in the Models tab, from a 75 MB tiny model for quick notes on a CPU to large-v3 (3.1 GB) for the best accuracy on a powerful GPU. The Dictionary tab also lets you add names, abbreviations and technical terms or set up replacements.
  Open Speech Studio is built with Tauri 2 (Rust), SolidJS and whisper.cpp.
