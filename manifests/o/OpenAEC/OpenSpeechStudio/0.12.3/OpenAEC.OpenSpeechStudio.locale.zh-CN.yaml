PackageIdentifier: OpenAEC.OpenSpeechStudio
PackageVersion: 0.12.3
PackageLocale: zh-CN
ShortDescription: 开源本地语音转文字应用，可在任意应用中进行实时语音输入。
Description: |-
  Open Speech Studio 是一款完全本地运行的开源语音识别应用——本地化的 AI 语音输入替代方案。所有语音识别都在你自己的电脑上进行：不连云端、无需订阅、充分保护隐私。它是 OpenAEC Foundation 旗下项目。
  功能：
  - 100% 本地：所有语音识别都在本地完成。
  - GPU 和 CPU：支持 GPU（CUDA/Vulkan）和 CPU，可按照自己的硬件选择合适的模型。
  - 多语言：支持 99 种以上语言，并自动检测语言。
  - 词典：添加自定义词汇、名称和专业术语，提高识别准确度。
  - 通用听写：通过全局快捷键在任意应用中输入语音（默认为 Ctrl+Shift+Space）。
  - 在线会议：同时录制麦克风和电脑音频，让 Teams、Zoom 或 Meet 会议中的每位与会者都进入转录内容（仅限 Windows）。
  在 Models 标签页下载语音模型，从适合 CPU 快速记录的 75 MB tiny 模型，到在强劲 GPU 上获得最佳准确率的 large-v3（3.1 GB）任你选择。词典标签页还支持添加名称、缩写和技术术语，或设置替换规则。
  Open Speech Studio 基于 Tauri 2（Rust）、SolidJS 和 whisper.cpp 构建。
