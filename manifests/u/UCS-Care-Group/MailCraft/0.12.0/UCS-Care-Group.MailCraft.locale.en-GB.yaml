ShortDescription: An open-source mail, calendar, contacts and tasks program, written from scratch in Rust.
Description: |-
  MailCraft is a clean-room reimplementation of the mail client people already know how to use: the ribbon, the folder pane, the message list with its reading pane, conversations, flags, categories, rules, a calendar with recurring meetings, people and to-dos. It is a native, GPU-rendered app (no Electron, no web view), it also runs in a browser tab through WebAssembly, and every action in it is a command that scripts and AI agents can run too.
  Mail accounts can be IMAP and SMTP over TLS or STARTTLS, Outlook.com or Microsoft 365 (signing in on Microsoft's page with OAuth 2.0), and an organisation's own Exchange server. Mail comes down, and what you do here goes back up: read marks, flags, moves, deletions and a copy of what you send. Passwords and sign-ins are kept by the system's credential store.
  Search understands a query language (budget from:ada has:attachment -draft after:2026-10-01 is:unread) in one folder or every mailbox. Writing covers Reply, Reply All and Forward, attachments, drafts, signatures, recipient suggestions and rich text sent as HTML with a plain-text part. Rules move, categorise, flag and delete new mail. The calendar has day, work-week, week and month views, recurring meetings, reminders, Find a Time, and invitations answered from the calendar or the message. File handles .eml, .mbox, .ics, .vcf and Outlook .pst files in and out.
  HTML mail is laid out with its tables, colours and pictures without running anything in it; pictures on the web are downloaded only when you ask, and links show where they go. The window comes in English with previews in French, German, Spanish, Italian, Dutch, Romanian and Simplified Chinese, in light and dark, with four accent colours and high contrast.
  A CLI, a JSON control channel and an MCP server expose every command, so scripts and AI agents can drive the same actions as the ribbon and the keyboard.
