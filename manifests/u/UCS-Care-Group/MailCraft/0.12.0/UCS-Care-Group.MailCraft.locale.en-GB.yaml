ReleaseNotes: |-
  What's new
  - Enable attachment previews in File › Options to preview PDFs and supported images in the reading pane with local PdfCraft or PhotoCraft. #1053
  - Import a .pst File now brings in notes and journal entries too, and mail kept as rich text keeps its HTML. The import is no longer a preview. Notes and the journal have no window of their own yet (#815).
  - OpenPGP Digital signatures are now checked in the reading pane; Public keys can be imported, listed and removed (#30).
  - File › Options › Security lists your own certificates and keys and imports a .p12 or an OpenPGP secret key; the Public keys kept for other people are listed and removed there, an OpenPGP key is marked as verified after comparing its fingerprint, and a contact's card shows its certificates (#30).
  - Help › Report a Problem can now send a report straight to the MailCraft team, no GitHub account needed: press Send report, and the window shows the report's reference. Only what the window shows goes, and only when you press Send; the report is kept private unless the team makes a real problem public on GitHub, where you can choose to be mentioned by your GitHub username. Open on GitHub is still there (#956).
  - Import a .pst File now brings in calendar items, with their repeat patterns and time zones, and tasks. Nothing is sent to anybody (#815).
  - Typing * or - at the start of a line in a message now starts a bulleted list, and 1. or 1) a numbered one. Undo straight afterwards puts back what you typed, and File › Options › Mail › Automatic bulleted and numbered lists turns it off (#973).
  - An S/MIME Digitally signed message says what checking its signature found, in a bar above it: verified, signed but the signer not verified, changed after it was signed, or can't be checked (an algorithm that's no longer safe, for one), with Details of who signed and their certificate; its row in the list wears a seal of the same. Trust comes from the certification authorities your system trusts for mail (on Linux its mail bundle, on Windows the roots trusted for secure mail; none on FreeBSD, whose authorities are for web sites, and none yet on macOS). An opaque signed message shows what it holds, its attachments too; revocation isn't checked yet (#30).
  - A contact's S/MIME certificates and OpenPGP keys in a vCard (KEY) are kept when the card is imported and written back when contacts are exported (#30).
  - A Gmail account's Inbox shows Gmail's categories, Primary, Social, Promotions, Updates and Forums, as five folders under it, each with its unread count, whether the account signs in with Google or an app password. Account Settings can hide them, or keep desktop alerts to mail in Primary, and the search finds them with gmail:social and the rest (#911).
  - View › Gmail Categories can show them as a row of tabs above the Inbox instead, each with its unread count (#911).
  - Pictures in all mail from the message. The bar above a message whose pictures were not downloaded now also offers Download pictures in all mail, the switch from File › Options in one click. It first says what that means: every sender's server learns when you opened a message and from which internet address. It stays off until you say yes, mail in Junk E-mail still never downloads pictures by itself, and File › Options turns it off again. (#910)
  - Each account can have a colour (Account Settings › Colour; a new account is given one): a dot beside its name in the folder pane, and a stripe on its mail in a search of All Mailboxes, so that whose mail is whose is seen at a glance (#893).
  - Import a .pst File brings in the members of a large distribution list too: past about 15,000 bytes Outlook keeps them in a form of their own, which the import now reads, up to 1,000 members a list (#843).
  - Pictures in replies and forwards. When you reply to or forward a message whose pictures are written into it rather than attached, the pictures now stay in the original below your text and go with your message, as they do from Outlook. Only pictures MailCraft would show are carried, within the same limits on size and number; nothing is downloaded for them (#602).
  Fixes
  - A message an earlier version left in the Outbox from a draft begun on another device, and that a run then held, goes again with Send Again (Microsoft and Exchange server accounts; #738).
  - A folder that a Microsoft 365 or Exchange server keeps for itself, such as RSS Feeds, can no longer end up in Deleted Items here while the server still has it where it was: once the server says it is one of its own, the folder goes back where the server has it, you are told why, and Delete Folder, Rename and Move are greyed out for it from then on (and refused with the reason when an agent or a script asks). A move or deletion the server turns down for another reason puts the folder back too, rather than stopping Send/Receive on it every time (#1069).
  - An imported .ics file no longer hides in your Microsoft 365 calendar without reaching it: when the account's calendar was the only one, an imported appointment went into it as if it were there, was never sent, and nothing offered to send it. It now goes into the calendar On this computer, with the bar above the calendar and Move to Calendar in its menu offering to move it to your account's calendar; one that an earlier import left behind goes there at the next Send/Receive (#1050).
  - Empty Folder on a folder of many thousands of messages no longer leaves the window not responding: a folder of 200,000 now empties in about a second (it took about an hour), and Delete, Delete Permanently, Archive and Junk of a large selection are as quick. Undo works as it did, and the server is told the same as before (#1037).
  - A server that can't be reached because it shares no encryption with MailCraft (often an old Exchange 2010 offering only CBC cipher suites) now says so, and that its administrator can turn on the AES-GCM suites, instead of a general connection failure (#977).
  - Add Account recognises legacy Outlook.com custom domains from their Hotmail MX records and selects Microsoft sign-in instead of guessed IMAP and SMTP settings; owners can keep their custom-domain address after confirming that Microsoft's returned address is an alias of the same mailbox (#1070).
  - Connecting Outlook's Favorites for an account whose organisation requires administrator approval for reading mailbox settings now shows the administrator approval message once instead of repeatedly prompting to connect (#986).
  - Week numbers in the calendar line up: in the Month view and in the date navigator every digit has a place of one width, where a number such as 20 used to start left of the others (#1009).
  - Import a .pst File no longer brings mail kept only as rich text in with an empty body: its text is the body, and the rich text is kept as an attachment (#815).
  - HTML newsletters keep headings up to 48 pixels, inline line height, image spacing, and the width of centered tables that size to their contents. CSS table rows and cells use the same layout as HTML table tags (#1021).
  - The Flatpak uses installed host fonts for Japanese and other scripts, and links in the reading pane are underlined close to their text (#1016).
  - An IMAP account with more than 2,000 folders has them all read now, up to 10,000 in one Send/Receive, each in its place in the folder tree, and the folder pane shows every folder of an account (it showed at most 4,000); with more than that, the message says how many were left out and the first of them (#991).
  - In English, dates now follow your system's regional format: in the UK, Ireland, Australia, New Zealand, India, South Africa and elsewhere outside the US, Canada and the Philippines they are written day first (14/10/2026, 14 Oct 2026), and the clock and the first day of the week are the region's unless you chose your own in File › Options. On Linux and FreeBSD the format is read from LC_TIME (#978).
  - An Exchange server account no longer downloads every message in full: like a Microsoft account, it keeps mail in full only within its Mail to keep offline (12 months unless you change it in File › Info or Account Settings), and older mail as headers and a preview that download when you open them. "Messages to download per folder" in File › Options is for IMAP accounts (#966).
  - A digitally signed (S/MIME or OpenPGP) message moved or copied to another IMAP account, saved as an .eml file or forwarded as an attachment now carries its signed body exactly as it arrived, so its signature still checks there; signed and encrypted mail is kept as it came for checking in a later version (#30).
  - In a plain-text message, Font, Font Size, Font Color and Text Highlight Color are greyed with the other formatting buttons, and say why (#862).
  - The reasons why your automatic replies weren't changed, and why desktop alerts can't be shown, are now translated on their own, apart from the heading they follow, so a translator writes each heading once (#912).
  - Text in Calibri, Cambria and other fonts that carry small bitmaps beside their outlines is drawn whole again: since 0.11.0 most of its letters were missing, drawn in white (#889).
  - The Reminders window answers Dismiss, Dismiss All, Snooze and its close button while the main window is minimized (#771).
  - Sign-in and server errors of IMAP and SMTP accounts are shown in the interface's language in Send/Receive problems, the status bar and Add Account, not only in English; what a server says for itself is still shown as the server wrote it (#872).
