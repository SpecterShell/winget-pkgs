PackageIdentifier: UCS-Care-Group.MailCraft
PackageVersion: 0.12.0
PackageLocale: zh-CN
ShortDescription: 一款从零开始用 Rust 编写的开源邮件、日历、联系人和任务程序。
Description: |-
  MailCraft 是对人们早已熟悉的邮件客户端的净室（clean-room）重实现：功能区、文件夹窗格、带阅读窗格的邮件列表、会话、标记、类别、规则，以及支持定期会议的日历、联系人待办人脉和任务。它是一款原生 GPU 渲染应用（无 Electron、无 WebView），还可通过 WebAssembly 在浏览器标签页中运行，其中的每个操作都是一条命令，脚本和 AI 代理同样可以执行。
  邮件账户可以是基于 TLS 或 STARTTLS 的 IMAP 和 SMTP、Outlook.com 或 Microsoft 365（通过 OAuth 2.0 在 Microsoft 页面上登录），也可以是组织自有的 Exchange 服务器。邮件会接收下来，你在本机所做的操作也会同步回去：已读标记、旗标、移动、删除以及已发送邮件的副本。密码和登录凭据由系统凭据存储器保管。
  搜索支持在单个文件夹或所有邮箱中使用查询语言（budget from:ada has:attachment -draft after:2026-10-01 is:unread）。撰写邮件涵盖答复、全部答复和转发、附件、草稿、签名、收件人建议，以及以 HTML 附纯文本部分发送的富文本。规则可对新邮件执行移动、归类、加旗标和删除。日历提供日、工作周、周和月视图，支持定期会议、提醒、查找时间，并可在日历或邮件中答复会议邀请。文件功能支持 .eml、.mbox、.ics、.vcf 和 Outlook .pst 文件的导入导出。
  HTML 邮件会在不运行其中任何内容的前提下按其表格、颜色和图片排版；网络图片只在你要求时才下载，链接会显示其去向。窗口提供英文界面，并以预览形式提供法语、德语、西班牙语、意大利语、荷兰语、罗马尼亚语和简体中文，支持浅色和深色主题，提供四种强调色和高对比度。
  命令行界面（CLI）、JSON 控制通道和 MCP 服务器开放了每一条命令，脚本和 AI 代理因此可以执行与功能区和键盘相同的操作。
