PackageIdentifier: FortoGraphy.Prism
PackageVersion: 1.2.4
PackageLocale: zh-CN
ShortDescription: 开源下载管理器，支持多连接下载、浏览器集成以及视频与 MP3 抓取。
Description: |-
  Prism 会将每个下载拆分为多达 32 个并行连接，让它们保持忙碌直到最后一个字节，并在崩溃、休眠和断网后继续。在浏览器中点击链接，Prism 即会接管；将鼠标悬停在视频上，即可按所需画质抓取 MP4——或仅保存 MP3。这一切都在沉静的液态玻璃界面中完成，支持深色和浅色主题。
  自由开源，无广告，无账户，无遥测。
  工作原理
  - 动态分段。当一个连接完成其部分时，会接管剩余最大部分的一半——因此每个连接都保持忙碌直到最后，慢的部分会被继续拆分，而不是等待一个缓慢的连接。
  - 服务器感知。Prism 会察觉服务器拒绝额外连接的时机，确定其允许的数量并按主机记忆。
  - 直接写入磁盘。数据直接写入最终文件（NTFS 上稀疏写入，Linux 上预分配）——最后无需缓慢的“组装”步骤。
  - 崩溃安全。进度只在数据写入磁盘后保存；恢复时 Prism 会用 If-Range 校验大小、ETag 和 Last-Modified。
  - Rust + Tauri。Rust 引擎（tokio、rustls），原生 Tauri 2 外壳中的 React 界面——小巧、快速、内存友好。
  为何选择 Prism
  - 最多快 15 倍。在限制每个连接速度的服务器上，Prism 的多连接引擎最多比普通浏览器下载快 15 倍。
  - 永不重来。暂停、合上笔记本、断电——Prism 会从停止处准确恢复，并检查服务器上的文件是否已变化。
  - 活在浏览器中。Chrome、Edge、Brave、Opera、Vivaldi 和 Firefox。下载会在约四分之一秒内跳入 Prism。
  - 视频与音乐。YouTube 及 1800 多个站点：MP4 最高 8K/HDR，或仅 MP3，支持字幕、章节和 SponsorBlock。
  - 全部协议。HTTP(S)、FTP/FTPS、HLS 与 DASH 流、BitTorrent 和磁力链接。
  - 井然有序。分类、按计划和速度限制的队列、“完成后关机”、站点抓取器、批量下载、剪贴板监视。
  - 你的语言。英语、捷克语、德语、西班牙语、法语、意大利语、印尼语、土耳其语、简体中文和阿拉伯语。Prism 会跟随系统语言，也可在设置中选择。
  - 精美界面。液态玻璃设计、深色与浅色主题、六种强调色、迷你窗口——面对成千上万的下载依然流畅。
