ShortDescription: Free open-source node-based audiovisual workstation with GPU compositing, 3D, modular synths, and VST3/AU hosting.
Description: |-
  Infinite is a free, open-source audiovisual workstation made by Naman Soni (n1m21n). Visuals, music and code live on one node canvas, on macOS, Windows and Linux, in English, Spanish, German, Chinese, Japanese and Russian. GPU image and video compositing, procedural 3D geometry and physics, and a modular synth rack with AU and VST3 plugin hosting all patch into each other through one modulation graph. Most nodes do one fixed thing, and Field, Infinite's own programming language, lets you write what a node does instead.
  Everything is a node, and every cable carries one kind of thing: pictures, 3D geometry, audio, notes or control signals. Patch left to right, right-click to add, and anything with a dot beside it can be modulated. Infinite has 347 node types.
  A GPU texture pipeline (GLSL, OpenGL 3.2 Core): images, video and camera, Syphon, Spout and NDI sources, shapes, noise and Field Pixel shaders, 32 blend modes, blur, bloom, glitch, halftone, curves, LUTs, reaction-diffusion, feedback loops and on-device background removal.
  Procedural meshes, imports (USD, OBJ, PLY, STL, glTF), booleans, Voronoi and Delaunay, instancing on points, particles, PBD cloth and soft bodies, metaballs, Camera and Light nodes, and PBR rendering (Cook-Torrance GGX, ACES, 32-bit HDRI). The 3D View panel composes them into one scene.
  A sample-accurate, pull-based audio graph on the same BPM transport as the pictures. Synths and physical models, a full effects rack, AU and VST3 plugin hosting with native windows and modulatable parameters, and Generate Samples, a player whose sample is made rather than loaded.
  Note sequencers, arpeggiator, chorder, quantizer and MIDI in and out on one side. LFOs, envelopes, random, pattern CV, audio analysis (8-band FFT, onsets), image analysis and camera tracking on the other. Any source can drive any parameter: a shader control, a 3D transform, a synth knob or a hosted plugin's parameter.
  Panels dock to the edges of the node canvas: a 3D View that composes and renders scenes, Sample Studio, Piano Roll, a Session clip launcher and Timeline arrangement, Mod Matrix, and a Performance surface with MIDI learn. A real terminal inside Infinite runs your own shell and tools, and the infinite command drives every panel, command and setting.
