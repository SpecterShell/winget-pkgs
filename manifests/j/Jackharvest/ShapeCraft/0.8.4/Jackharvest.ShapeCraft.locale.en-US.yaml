ShortDescription: 'Free 3D modeling: sketch a shape, pull it into a solid, round the edges.'
Description: |-
  ShapeCraft is for making real things: a part for your 3D printer, a box for your electronics, the bracket you have been meaning to design for six months. You don't need to be an engineer, and you don't need to sign up for anything. Download it, open it, and start shaping.
  The whole trick is three moves: sketch on any face and type a size whenever you know one, grab the sketch and drag to add or cut material, and drag an edge to round it. Then move it, copy it, pattern it, and send it to your printer.
  There is no account, no sign-in and no telemetry; projects are plain folders on your disk and work on a plane. Every step stays editable on its Parameter Card, so changing a number later rebuilds the model. First launch lets you pick the navigation your hands already know from a dozen popular CAD and 3D apps, so orbit, pan and zoom just work.
  ShapeCraft opens .shapr, STEP, Parasolid XT, IGES, STL, 3MF and OBJ, takes DXF and SVG as sketches, and exports glTF plus 2D drawings to PDF, SVG, DXF and DWG. Sketching covers lines, arcs, splines, rectangles, circles, polygons and text with snapping, inference, constraints and driving dimensions; modeling covers extrude, revolve, sweep, loft, fillet, chamfer, shell, booleans, split, mirror, patterns and emboss. STL and OBJ files come in as light mesh bodies that take transforms and booleans without slowing down.
  Three built-in tutorials, about seven minutes each, come in eleven languages, with light and dark themes and a GPU backend across Vulkan, Metal, DirectX 12 and OpenGL with a software fallback. Every menu item, tool and key is a registered command reached by the CLI, a JSON control channel and a built-in MCP server, so an agent can model while you watch.
