PackageIdentifier: Jackharvest.ShapeCraft
PackageVersion: 0.8.0
PackageLocale: zh-CN
ShortDescription: 免费的三维建模：画个草图，拉成实体，把边倒圆。
Description: |-
  ShapeCraft 用来制作真实的东西：3D 打印机的零件、电子设备的盒子，或者那个你念叨了半年还没设计的支架。你不需要是工程师，也不需要注册任何账号。下载、打开、开始塑形。
  整个诀窍就是三步：在任意面上画草图，知道尺寸时直接输入；抓住草图拖动，向上拉伸、向下切割；拖动一条边把它倒圆。然后移动、复制、阵列，送到打印机。
  无需账号、无需登录、无遥测；项目是磁盘上的普通文件夹，离线也能工作。每一步都保留在其参数卡片上，之后修改一个数字，模型就会重新生成。首次启动时可以选择你已经熟悉的十几种流行 CAD 和三维应用的导航方式，旋转、平移、缩放都能顺手使用。
  ShapeCraft 可以打开 .shapr、STEP、Parasolid XT、IGES、STL、3MF 和 OBJ，并将 DXF 和 SVG 作为草图导入；可导出 glTF，以及 PDF、SVG、DXF 和 DWG 二维图纸。草图功能涵盖直线、圆弧、样条、矩形、圆、多边形和文字，支持捕捉、推断、约束和驱动尺寸；建模功能涵盖拉伸、旋转、扫掠、放样、倒圆、倒角、抽壳、布尔运算、分割、镜像、阵列和浮雕。STL 和 OBJ 文件会作为轻量网格实体导入，可直接变换和布尔运算而不会拖慢速度。
  内置三个教程，每个约七分钟，提供十一种语言，支持浅色和深色主题，GPU 后端覆盖 Vulkan、Metal、DirectX 12 和 OpenGL 并带软件回退。每个菜单项、工具和按键都是一条注册命令，可通过命令行界面、JSON 控制通道和内置 MCP 服务器调用，AI 代理因此可以在你注视下建模。
