ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.177.2
  新功能
  - TUI 增加默认麦克风听写，并在侧会话打开期间定期刷新父会话快照。
  - 语音设置展示当前模型连接的实时语音可用状态与具体阻断原因。
  - 接入实时语音临时凭据与 WebRTC 会话，补充模型、声音选择和连接状态反馈。
  - 浏览器设置支持选择密码管理器，并完善扩展、站点权限与模型连接操作反馈。
  - 桌面菜单补充新建标签页、窗口与聊天入口，完善应用快照和工作区审阅快捷键。
  修复
  - 修复首次启动权限向导延迟出现时，macOS 安装包验证无法打开设置的问题；通过正常“稍后设置”操作继续验证。
  - 修复 Windows 启动 macOS 专属应用快照监听导致工作台重载失败的问题。
  - macOS 应用快照快捷键先检查输入监控权限，避免首次启动时调用未获授权的监听操作。
  - 修复附件处理与待处理应用快照的恢复，完善设置搜索、语音与连接页的状态同步。
  - 补齐实时语音 Provider 快照的 Rust 导出，并修复应用快照快捷键偏好的回归断言。
  - 修复 Electron 打包遗漏运行时 TOML 依赖、协议测试时间戳溢出与版本更新脚本的匹配范围。
  - 升级 TOML 依赖至安全修复版本，解决畸形文档导致拒绝服务的高危漏洞。
  优化与重构
  - 发布产物统一为 macOS arm64/x64 与 Windows x64，清理 Linux 分发目标及相关上传流程。
  - 同步实时语音能力的公共协议、JSON Schema、生成客户端与前端消费者；未实现的传输保持明确不可用。
  - 清理 App Server 中的冗余转换与测试写法，保持现役 runtime、投影及 Provider 边界。
  - 更新简体中文、繁体中文、英文、日文和韩文设置资源。
  - 完善外观字体、字号、代码样式与明暗模式设置，并同步 Markdown 和差异审阅展示。
  - 清理自建浏览器密码存储与 SSH 设置入口，保留联系人自动填充。
  测试与质量
  - 补充权限向导延迟出现、已完成偏好、非法响应和失败终态的回归。
  - 补充实时语音公共 JSON-RPC、密码管理器偏好、站点设置、连接、应用快照与附件测试。
  - 跨平台打包、公证、安装、更新与发布结果以本次 Release 流水线及执行计划记录为准。
  文档
  - 更新发布恢复计划，记录失败原因、候选范围、验证与同版本发布结果。
  其他
  - 应用、CLI、Rust workspace 与 Cargo 锁文件版本统一为 1.177.2。
  完整变更：v1.176.0 → v1.177.2
