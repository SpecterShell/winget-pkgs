ReleaseNotes: |-
  A new release of Igor Pro 10 is now available. A list of notable changes for this release is included below. Go to the Downloads page or select the Help→Updates for Igor Pro menu item within Igor Pro 10 to get the latest release. If you've reported an issue to us and we've told you it has been fixed, the fix will be included in this release, even if it's not mentioned below.
  New Features
  AI Integration in Igor Pro
  - You can now use AI agents to work in Igor for you. Ask an agent in an AI app such as Visual Studio Code, Claude Desktop/Code, Cursor, or Codex to write and debug Igor procedures, load and analyze data, make and refine graphs, or explain how an Igor operation works. The agent does the work in your running copy of Igor and checks the results itself, by reading compile errors and command output and by looking at images of your graphs. This works through the new Igor Pro MCP Server, which uses the Model Context Protocol (MCP). MCP is an open standard that lets large language models (LLMs) such as GPT, Claude, and Gemini communicate with and take action in an external application such as Igor Pro. For more information about MCP, see https://modelcontextprotocol.io/.

    The Igor Pro MCP Server provides tools that AI agents use to work in Igor and get feedback. For example, AI agents can:
    - Open and compile procedure files, receiving compile errors as feedback
    - Execute Igor commands and call built-in and user-defined functions
    - Look up the documentation for built-in operations and functions at https://docs.wavemetrics.com/igorpro/commands
    - Capture images of Igor windows for visual feedback
    - Inspect the state of Igor and get information about the current experiment
    - Launch and quit Igor
    See the MCP server in action at AI Tools | Igor Pro by WaveMetrics

  - The Igor Pro 10.05 installer includes the server installer. To install the server for your Windows user account, choose Help🠖AI Tools🠖Install/Repair Igor Pro MCP Server or click the AI connection button in the status bar. When Igor checks for updates, it also checks for server updates. Use the Help🠖AI Tools submenu to choose whether AI apps can connect to Igor now or whenever Igor starts. To set up your AI app to use the server, see https://docs.wavemetrics.com/igorpro/mcp-server.
  Other Features
  - The Python console's igorpro.fn completion now shows Igor function names.
  Bug Fixes
  - Fixed range-based loops so they use the iterated wave's current data, type, and point count on each iteration. Changes to a wave made in the loop body, including resizing, retyping, or killing it, are now handled correctly.
  - Fixed a bug where pressing the Down Arrow key in the Python console could clear the current entry, including a partially entered multiline statement.
  - Fixed rendering artifacts in dense line graphs that use miter or bevel joins.
  - Fixed display-scaling drift caused by truncation when scaling and restoring window coordinates.
  - Fixed crashes when operations such as FuncFit, FindRoots, Optimize, Integrate1D, IntegrateODE, or StatsKSTest called user functions that had been scanned but not compiled. These operations now report that the procedure must be compiled. Also fixed a crash when StatsResample /JCKN was run from the command line.
  - Fixed a problem introduced in Igor Pro 10.04 that caused some procedures using ErrorBars with the nochange keyword to no longer compile.
  - Fixed a potential buffer overflow in the Error Bars dialog
