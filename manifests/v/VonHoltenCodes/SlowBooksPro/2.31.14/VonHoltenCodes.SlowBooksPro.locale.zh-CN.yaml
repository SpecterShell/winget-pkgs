ShortDescription: 免费的记账会计软件，包含工资、存货与开票功能。
Description: |-
  SlowBooks Pro 2026 是一款免费且开放源代码的记账会计软件。复式记账、开票、应付账款、银行业务、美国工资单与税务表格、永续盘存以及分析仪表盘都在本地运行，没有订阅、没有使用遥测，也无需登录任何账户。每家公司账套都是存储在你自己电脑上的单个文件。
  所有功能全部免费：没有试用、没有付费档位、没有发票数量上限，也没有任何需要取消的东西。个人和商业使用均免费，大型公司也不例外。
  完全本地化：没有 SaaS 后端，也没有第三方云。每家公司账套是你电脑上的一个文件，或者放在你自建服务器上的 PostgreSQL 数据库中。
  数据归你所有：备份可以随时下载和恢复，支持 IIF、CSV 和 PDF 导出，也没有任何合同把你锁在里面。可选的文件加密默认关闭，直到你主动开启；加密账套的备份同样保持加密。
  Server Edition 内置于同一个 Windows 安装程序中。一台办公电脑即可通过浏览器为所有人服务，提供按用户的登录、角色（管理员、记账员、会计、只读）以及记录谁改了什么的审计跟踪。也可以选择在 Linux 服务器或 VPS 上用 Docker 加 PostgreSQL 运行。
  分析仪表盘显示 KPI 卡片、12 个月收入趋势、应收/应付账款账龄、90 天现金流预测和支出图表，并支持 CSV 和 PDF 导出。
  从 QuickBooks 迁移：可以导入从 QuickBooks Desktop 导出的 IIF 文件，QuickBooks Online 账套也能通过其自带的 Export data 压缩包迁入，未结发票一并包含。Xero、MYOB、Sage 50、Wave、Zoho Books 和 GnuCash 同样支持导入，导入前的试运行会预先展示将要带入的内容。Stripe、PayPal 或 Square 会在发出的发票上添加"在线支付"按钮，并把收款自动过账回你的账簿。
  如果需要，可以自带 AI：可选的 AI Insights 采用自带密钥模式，支持 Anthropic Claude、xAI Grok、Groq、OpenAI、Google Gemini、Cloudflare Workers AI 以及任何兼容 OpenAI 的接口。在你添加密钥并点击之前不会发送任何数据，密钥也经过静态加密。
  非营利组织模式可以跟踪带捐赠限制的资金以及项目、管理和筹资支出，生成活动状况表、财务状况表、基金余额表和职能支出表，并提供捐赠收据和年度捐赠报表。
  两种主题下均无障碍：浅色和深色主题满足 WCAG AA 对比度，每个表单字段都会向屏幕阅读器播报其标签，发票和税务表格的 PDF 也带有标签（PDF/UA-1）。
