ReleaseNotes: |-
  A patch release: six fixes, no migration (the chain head stays f3b9d2e6a1c7).
  - Cash basis and retainage (#778). A payment recorded before 2.31.11 on a pay application that holds retainage, or on a retainage-release bill, kept the cash lines the old rule wrote: held retainage counted as income, and a paid release sat on 6990 with no job. The upgrade rewrites those cash lines once so they read as a fresh posting does; a payment on or before the closing date is left as it was and counted, the start-up log says how many of each, and the pass also runs after an import or a backup restore. The accrual books do not move.
  - Purchase lines on the control accounts (#785). The server now refuses a bill, expense, card charge, quick-entry or memorized-bill line, and a bill made from a purchase order, on Accounts Receivable, Accounts Payable, Undeposited Funds or Inventory, in a sentence naming the account and where such a posting belongs. A line already saved there keeps its account until it is moved.
  - A quantity or rate past its column (#782). A huge quantity at a rate of 0 was a 500. A quantity, rate or unit cost too large for its column is refused with a sentence before anything rounds it, on every document with lines.
  - The forms' cents (#783). The estimate, sales and purchase forms round half away from zero on the value's own digits, as the server does, so a deduct alternate on a half cent, or a product like 0.3 × 2.15, reads the same on the form, in the API and on the PDF.
  - Recurring frequency (#779). POST/PUT /api/recurring take only daily, weekly, semimonthly, monthly, quarterly or yearly, refuse anything else with a sentence, and the OpenAPI schema lists the six.
  - Email record and log (#780, #781). GET /api/invoices/{id} carries last_emailed_at and last_emailed_to; GET /api/email-log answers a bookkeeper, accountant or read-only sign-in or token with the failure's sentence in place of the raw SMTP error, and every row names the document it was sent for.
  The update is offered on the app's next start; the Mac DMG and the Windows installer are below.
