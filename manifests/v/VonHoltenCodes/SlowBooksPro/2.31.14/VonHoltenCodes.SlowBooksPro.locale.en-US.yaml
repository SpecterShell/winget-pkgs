ShortDescription: Free bookkeeping and accounting software with payroll, inventory, and invoicing.
Description: |-
  SlowBooks Pro 2026 is free, source-available bookkeeping and accounting software. Double-entry books, invoicing, bills, banking, US payroll and tax forms, perpetual inventory, and an analytics dashboard run locally with no subscription, no usage telemetry, and no account to sign into. Each company is a single file stored on your own computer.
  Free, every feature: no trial, no paid tier, no invoice cap, and nothing to cancel. Free for personal and business use, including large companies.
  Completely local: no SaaS backend and no third-party cloud. Each company is one file on your computer, or a PostgreSQL database on a server you run.
  You own the data: backups you can download and restore, IIF, CSV, and PDF exports, and no contract keeping you in. Optional file encryption stays off until you turn it on, and backups of an encrypted company stay encrypted.
  Server Edition is built into the same Windows installer. One office PC serves everyone in a browser with per-user logins, roles (admin, bookkeeper, accountant, read-only), and an audit trail that names who changed what. Docker with PostgreSQL on a Linux server or VPS is an optional alternative.
  The analytics dashboard shows KPI cards, a 12-month revenue trend, A/R and A/P aging, a 90-day cash forecast, and an expense chart, with CSV and PDF export.
  Move in from QuickBooks: imports IIF files exported from QuickBooks Desktop, and QuickBooks Online companies move in from QuickBooks' own Export data zip with open invoices included. Xero, MYOB, Sage 50, Wave, Zoho Books, and GnuCash import too, with a dry run that shows what will come in before anything does. Stripe, PayPal, or Square add a Pay Online button to emailed invoices and post payments back to the ledger.
  Bring your own AI, if you want it: optional AI Insights are bring-your-own-key across Anthropic Claude, xAI Grok, Groq, OpenAI, Google Gemini, Cloudflare Workers AI, and any OpenAI-compatible endpoint. Nothing is sent until you add a key and click, and keys are encrypted at rest.
  Nonprofit mode tracks funds with donor restrictions and program, management, and fundraising expenses, and produces statements of activities, financial position, fund balances, and functional expenses, plus donor receipts and year-end giving statements.
  Accessible in both themes: WCAG AA contrast in the light and dark themes, every form field announced with its label to screen readers, and tagged PDFs (PDF/UA-1) for invoices and tax forms.
