ReleaseNotes: |-
  Good afternoon Everyone,
  It's been quite a while since Icaros has had a big release, so today I'm very excited to share what I've been
  working on all summer and fall. ❤️
  A lot of these features I've actually been working on for a lot longer, but I finally had the time to put it all
  together and test them all thoroughly.
  The main feature of Icaros 4.0.0 is the all new Atlas module, an optional add-on to Icaros,
  that enables SVG, SVGZ, JXL and PDF thumbnailing.
  There are a couple of reasons, why I decided to make Atlas an optional add-on instead of just
  baking it into the base Icaros release:
  1. It expands the size of Icaros by ~75% while only adding 3 new formats, that some users may not need.
  2. It doesn't work on Windows Vista, which base Icaros still does.
     (Icaros biggest supporter (by far), uses Windows Vista. Thank you so much! __)
  3. It adds two new libraries, which could potentially bring new bugs with them.
     By having it separate from the base release, a user can always remove it if any problems occur.
  For users that use the installer, it's just a single checkbox to install Atlas during the install/upgrade process.
  For users that use the portable version of Icaros, you just need to download the Atlas.zip file from this
  page and drop it into the Thumbnailing Page of IcarosConfig to install it.
  The release also brings a big revision of the cache code, which brings a lot of cool new changes:
  1. Multithreaded indexer which speeds up the indexing significantly (on my system an index run
     went from 3min 40secs to just 21secs!, with the default threading settings).
  2. It's overall quite a bit faster now both at storing and retrieving thumbnails.
  3. It now stores thumbnails more efficiently saving a lot of space (on my system the cache went
     from 920MB to 340MB).
  4. And lot's more (see changelog).
  I've also added support for a large number of new formats, as well as fixed a ton of bugs reported by the users.
  So overall it's quite a large release. Be sure to check out the changelog.
  And of course, due to the many many changes, it's released as an Alpha build, so don't hesitate to report
  any new bugs and/or regressions to me.
  As always, Thank you all for posting feedback, and giving continuous support and donations!
  It really means so much to me! ❤️
  I truly hope you all enjoy this new release! ❤️

  Icaros v.4.0.0 Alpha 1
  ATLAS
  Atlas is a new optional module for Icaros that adds thumbnailing of more advanced formats
  - Added support for SVG/SVGZ thumbnailing
  - Added support for JXL thumbnailing
  - Added full support for PDF thumbnailing
  ICAROS
  - Added support for MOBI thumbnailing
  - Added support for FB2 thumbnailing
  - Added support for RAW thumbnailing (embedded previews) - DNG, CR2, CR3, NEF, NRW, ARW, SR2, SRF, SRW, ORF, ORI, PEF, RW2, RWL, RAF, 3FR, FFF, DCR, DCS, KDC, K25, MEF, MOS, ERF, BAY and DRF
  - Added support for PSB thumbnailing
  - Added support for DDS files with BC7 compression
  - Added support for CBR files with RAR5 compression
  - Added support for EPS files with embedded TIFF and WMF previews
  - Added HDR to SDR tonemapping (so HDR thumbnails no longer look washed out)
  - Added proper support for alpha channels in HEIF/AVIF files
  - Added more DDS properties (Dimensions, Compression, Mipmap levels and fixed the Bit depth)
  - Added RAW, FB2, MOBI, SVGZ and PSX as image formats
  - Added FB2 and MOBI as default filetypes
  - Improved thumbnailing of 'tiled' HEIC files (Support background color and better tile order, cropping and orientation)
  - Improved JPEG thumbnailing performance significantly for large JPEGs
  - Improved HEVC thumbnailing performance
  - Improved thumbnailing performance of MPEGTS and SER files
  - Improved thumbnailing of H264 files with missing data
  - Improved thumbnailing of JPEG2000 files
  - Fixed thumbnailing of CBX files with embedded MacOS entries
  - Fixed JPEG/TIFF orientation
  - Fixed property parsing of MKV files with linked seekheads, and improved detection of chapters
  - Fixed hangs when parsing very large empty files
  - Fixed a couple of memory leaks
  - Optimized the FFmpeg dlls size a bit
  ICAROS CACHE
  - The Cache Indexer is now multithreaded, which makes indexing a lot faster (can be set with the new 'Indexer Threads' option)
  - Heavily improved the overall cache speed (retrieval and storing)
  - Heavily improved the size of the cache
  - Heavily improved lookup speed in very large caches
  - Improved thumbnail retrieval speed when many thumbnails are requested at once
  - Improved cache thread safety
  - Implemented a new and stronger hashing algorithm to avoid potential file collisions
  - Fixed the 0x14 "no files found in indexed locations" error on systems where the username and computer name are the same
  - Fixed crash when parsing a corrupt cache during a Cache Rebuild
  - Fixed the indexer failing an entire location when a single subfolder fails
  - Fixed it so Icaros now still generates a thumbnail if decoding fails in the cache (rare)
  - Fixed a couple of memory leaks and a few other minor issues
  ICAROSCONFIG
  - Added drag and drop installation of Icaros modules like Atlas
  - Added an Atlas dialog that shows up the first time Atlas is installed, so supported filetypes can quickly be added
  - Added a suggestion to install Atlas when SVG/SVGZ, PDF or JXL is added without Atlas installed
  - Added Atlas filetypes to the 'Common' preset when Atlas is installed
  - Added 'Indexer Threads' option to the Cache page
  - Added RAW filetypes and PSX to the 'Most Known' preset
  - Removed JPG and PNG from the presets, as they break several preview features in the Windows control panel and login screen
  - Fixed default Windows borders drawing on top of IcarosConfig when using Basic or Classic themes
  - Tooltips now show up a bit faster
  INSTALLER
  - Rewrote the installer
  - Atlas can now be selected in the installer, and can be downloaded and installed by the installer on systems that support it
  - The installer can now perform the entire installation of the .NET Framework itself when needed
  - The installer now shows the correct Icaros version
  GENERAL
  - Updated German localization (Thank you Klaus Luppert! __)
  - Updated Dav1d to 1.5.3
  - Updated GCC
  - Updated FFmpeg
