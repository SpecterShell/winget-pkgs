ShortDescription: XarQ is a free, open-source vector, photo and web design studio built on Qt6. It reads and writes native Xara .xar files and imports files from many other design tools.
Description: |-
  XarQ is a vector, photo and web design application built on Qt6. It reads and writes native Xara .xar files, and it imports files from many other design tools.
  XarQ continues Xara Xtreme, the GPL release of Xara. It is a new application that reads and writes the same .xar format, checked against reference renders.
  Vector drawing
  Draw with the pen, line, freehand, rectangle, ellipse and polygon tools, then reshape any path node by node. Outline view shows the structure of a drawing without its fills. Add, subtract, intersect, slice and join shapes. Variable-width lines, stroke shapes and art brushes made from your own selection.
  Live effects
  Bevel, shadow, contour, feather and 3D extrude each have their own tool on the rail. Blend morphs one outline into another through as many steps as you set. Mould bends artwork inside an envelope. Effects stay editable.
  Colour and fills
  Drag a fill directly on the canvas with the fill tool. Linear, radial, conical and other fill types live beside mesh gradients, fractal fills and transparency stops. Recolour, replace a colour, or extract a palette from a photo. ICC profiles and CMYK soft proofing through Little-CMS.
  Photo editing
  Adjust, crop and straighten photos on the canvas. Levels, perspective correction, cutouts and content-aware resizing are in the same application as your vectors. Trace a bitmap into vector shapes, or stitch selected photos into a panorama.
  Text and typography
  Fit text to a curve or inside a shape, link frames so it flows between them, and let it wrap around other objects. OpenType features, tab stops with leaders, lists and smart quotes. Spell check, find and replace, word count and change case.
  Page layout
  From a single page to a whole document. Multiple pages, master layers, guides, grids and page numbers. Layers can be soloed or kept from printing. Build tables from CSV, run a mail merge, insert QR codes, and repeat objects in rows or radial arrays.
  Prepress
  Soft-proof in CMYK with gamut and ink-limit warnings. Export separations, composite CMYK PDF and crop marks, or impose pages as an N-up sheet, a booklet or a tiled poster.
  Web design
  Design a page, publish a website. Place objects freely, then publish the document as HTML. Add navigation bars, contact forms, sliders and animation, and preview the page at different widths. FlexGroups reflow on mobile, and website variants set each object's mobile position. Page titles, descriptions and keywords, per page and for the whole site.
  Formats
  Opens what you already have: .xar (open and save), .svg, .pdf, .ai and .eps (PostScript), .psd, .afdesign, .cdr and .cmx (CorelDRAW), .dxf and .dwg (CAD), .docx and .rtf, .odg and .odp (OpenDocument), .geojson and .kml (maps), .png and .webp.
