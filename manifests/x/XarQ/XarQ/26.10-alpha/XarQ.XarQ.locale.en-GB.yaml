ReleaseNotes: |-
  The first alpha of XarQ, a Qt6 vector, photo and web design studio that reads and writes native Xara .xar files. It is an alpha: expect rough edges, and keep copies of files you care about.
  Not in this build
  - Linux and Windows: AutoCAD DWG and the GDAL formats (DGN, MapInfo, GeoPackage, S-57, GML).
  - Windows: JPEG XR, WMF and Mobipocket import, and hyphenation and spell-check dictionaries.
  - Linux: hyphenation and spelling use the dictionaries installed on your system, if any.
