ShortDescription: XarQ 是基于 Qt6 的矢量、照片和网页设计应用。它可以读写原生 Xara .xar 文件，也能导入许多其他设计工具的文件。
Description: |-
  XarQ 是基于 Qt6 的矢量、照片和网页设计应用。它可以读写原生 Xara .xar 文件，也能导入许多其他设计工具的文件。
  XarQ 是 Xara Xtreme（Xara 的 GPL 版本）的延续。它是一个全新的应用，读写同样的 .xar 格式，并对照参考渲染图进行了检查。
  矢量绘图
  用钢笔、直线、手绘、矩形、椭圆和多边形工具绘图，再逐个节点调整任何路径。轮廓视图会显示图形的结构，不显示填充。形状可以相加、相减、相交、切片和连接。可变宽度的线条、描边形状，以及用你自己的选区制作的艺术画笔。
  实时效果
  斜角、阴影、轮廓、羽化和 3D 挤出，在工具栏上各有自己的工具。混合可以按你设定的步数，把一个轮廓渐变成另一个。塑形可以让作品贴合封套弯曲。效果始终可编辑。
  颜色与填充
  用填充工具直接在画布上拖出填充。线性、径向、圆锥等填充类型，与网格渐变、分形填充和透明度节点放在一起。可以重新着色、替换颜色，或从照片中提取调色板。通过 Little-CMS 支持 ICC 配置文件和 CMYK 软打样。
  照片编辑
  在画布上调整、裁剪和校正照片。色阶、透视校正、抠图和内容感知缩放，与你的矢量图形在同一个应用里。把位图描摹成矢量形状，或把选中的照片拼接成全景图。
  文字与排印
  让文字沿曲线排列或填入形状，链接文本框让文字在框之间流动，并让它环绕其他对象。OpenType 特性、带前导符的制表位、列表和智能引号。拼写检查、查找和替换、字数统计和大小写转换。
  页面排版
  从单页到整份文档。多页面、主图层、参考线、网格和页码。图层可以单独显示，也可以设为不打印。用 CSV 生成表格，进行邮件合并，插入二维码，并按行或径向阵列重复对象。
  印前
  以 CMYK 软打样，并给出色域和油墨限量警告。导出分色、复合 CMYK PDF 和裁切标记，或把页面拼版成 N-up 版面、小册子或平铺海报。
  网页设计
  设计一个页面，发布一个网站。自由摆放对象，然后把文档发布为 HTML。添加导航栏、联系表单、滑块和动画，并在不同宽度下预览页面。FlexGroup 会在手机上重新排列，网站变体可设置每个对象在手机上的位置。页面标题、描述和关键词，可按页面设置，也可对整个网站设置。
  格式
  能打开你已有的文件：.xar（打开和保存）、.svg、.pdf、.ai 和 .eps（PostScript）、.psd、.afdesign、.cdr 和 .cmx（CorelDRAW）、.dxf 和 .dwg（CAD）、.docx 和 .rtf、.odg 和 .odp（OpenDocument）、.geojson 和 .kml（地图）、.png 和 .webp。
