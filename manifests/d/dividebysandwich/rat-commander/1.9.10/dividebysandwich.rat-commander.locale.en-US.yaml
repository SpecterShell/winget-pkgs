ShortDescription: A terminal file manager in the spirit of Midnight Commander.
Description: 'Rat Commander (rc) is a self-contained terminal file manager with modern features, staying true to the heritage of Norton Commander and Midnight Commander. It offers two panels with multiple view formats, full mouse support, and built-in tools that need no external programs: a viewer and editor with syntax highlighting, archive handling, FTP/SFTP/SCP clients, a disk explorer, a process explorer, a disk imager and a network monitor.'
