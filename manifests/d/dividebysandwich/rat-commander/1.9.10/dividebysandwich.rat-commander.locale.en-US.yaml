ReleaseNotes: |-
  What's new
  - Shift-F6 now renames the file under the cursor in place. The prompt is prefilled with its current name and the new name stays in the same folder. With files marked, Shift-F6 still opens Multi rename, and Ctrl-F6 always does (#25)
  - Fixed mouse movement over SSH sometimes being read as an Esc press plus stray text like [<35;60;26M. This closed open dialogs, typed into the command line or quick search, and made wheel scrolling jump around (#26)
  - Fixed pasted text losing a character every 65 characters in the command line and the editor. The same bug also dropped events during fast scrolling and key repeat
  Full Changelog: https://github.com/dividebysandwich/rat-commander/compare/v1.9.9...v1.9.10
