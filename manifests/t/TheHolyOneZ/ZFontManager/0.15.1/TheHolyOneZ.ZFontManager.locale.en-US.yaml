ShortDescription: Free and open-source font manager to preview, organize, activate and install fonts.
Description: |-
  ZFontManager is a free, open-source font manager for Windows, macOS and Linux. Preview, organize, activate and install fonts from one clean, fast, native app; your library never leaves your machine and there is no telemetry.
  - Every family rendered live in the library view, one toggle away from any app's font menu
  - One-click activate and deactivate fonts without installing or uninstalling them
  - Try a font before committing, apply fonts in Photoshop or Illustrator, and auto-activate for Affinity by Canva
  - Browse and download free fonts from a built-in catalog of around 2,000 Google Fonts
  - Side-by-side compare, waterfall view, specimen export, font file inspection, and drag-and-drop install
  - Organize with tags, collections, favorites and notes; find anything with search and the command palette
  - Built with Tauri and Rust
