PackageIdentifier: TheHolyOneZ.ZFontManager
PackageVersion: 0.15.1
PackageLocale: zh-CN
ShortDescription: 免费开源的字体管理器，可预览、整理、激活和安装字体。
Description: |-
  ZFontManager 是一款适用于 Windows、macOS 和 Linux 的免费开源字体管理器。在一个简洁、快速的原生应用中预览、整理、激活和安装字体；字体库永远不会离开你的电脑，也没有任何遥测。
  - 每个字族都在字体库视图中实时渲染，切换一下即可在任何应用的字体菜单中使用
  - 一键激活和停用字体，无需安装或卸载
  - 在正式采用前先试用字体，在 Photoshop 或 Illustrator 中应用字体，并为 Canva 旗下的 Affinity 自动激活
  - 从内置的约 2,000 款 Google Fonts 目录中浏览并下载免费字体
  - 并排比较、瀑布式预览、字样导出、字体文件检查以及拖放安装
  - 用标签、收藏集、收藏夹和备注整理字体；借助搜索和命令面板找到任何字体
  - 基于 Tauri 和 Rust 构建
Tags:
- 字体
- 字体排印
- 字体预览
