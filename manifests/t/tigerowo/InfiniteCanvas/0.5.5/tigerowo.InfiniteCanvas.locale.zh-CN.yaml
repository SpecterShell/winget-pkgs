ReleaseNotes: |-
  新增 MiniMax-H3 官方传参协议。
  新增 OpenAI 兼容 Chat Completions 生图模式。
  新增 Gemini 原生文本、图片、视频和 TTS 协议支持。
  修复 3D 导演台角色标签在系统显示缩放下位置偏移和尺寸异常的问题。
  修复未登录生图结果使用 Base64 返回时刷新后图片丢失的问题。
  修复 Agent 画布媒体引用同步及节点删除后的文件清理问题。
  修复 Grok2API TTS 协议参数为最新。
  未登录可在后台允许时配置个人 S3/R2 和 WebDAV。
  API 模型渠道细分，自动填充 API URL。
  私有云存储媒体改为按需分段流式读取。
