ReleaseNotes: |-
  新功能
  - 云同步可以按内容类型选择交换范围，主机、设置、笔记、代码片段、端口转发、凭据、SSH 密钥、AI 提供商等都可以单独关闭，关闭后不再上传或下载。
  - 侧边栏可以自行选择显示哪些页面。
  - 跳板机可以按中心节点（hub）管理，并批量关联主机。
  - SFTP 文件面板可以修改文件所有者。
  - 服务器之间可以直接复制文件，不再经本机中转；一次拖拽或粘贴是一批传输。
  - VNC 会话可以使用 macOS 屏幕共享的 ARD 账号密码认证。
  - MCP 客户端可以查询和编辑笔记库，并让长命令在后台运行、按偏移轮询输出。
  - 文件传输进行中或正在查看远端桌面时，会阻止系统进入睡眠。
  改进
  - 应用内更新优先读取签名源，有差异包时只下载差异部分，失败再回退完整包。
  - 加密私钥只在真正需要时询问口令。
  - 远端桌面会话的内存占用有上限，长时间查看更稳定。
  - 登录时只运行一次 Bash 启动脚本。
  修复
  - 修复 Windows 11 浅色模式下窗口四周透出背景、看起来有约 2px 透明边缘的问题，高缩放下更明显。
  - 修复 Ubuntu 等主机登录横幅（MOTD、last login）只显示一部分或不显示的问题。
  - 修复本地 PowerShell 页签不显示版本横幅、与 Windows Terminal 不一致的问题。
  - 修复命令面板只列出部分侧边栏页面的问题。
  - 修复 MCP HTTP 会话闲置 30 分钟后客户端无法恢复的问题。
  - 修复终端框线字符笔画粗细与字体不一致的问题。
  - 修复启动失败时提示的日志文件实际不存在的问题。
  - 修复启用 MCP 完全访问后，退出应用时可能卡住的问题。
  - 修复主机缺少地址时没有提示补全的问题。
  - 修复 SFTP 传输筛选会隐藏新任务的问题。
  - 修复文件编辑器双击不能选中单词的问题。
  - 修复 PowerShell 清屏后输入位置没有复位的问题。
