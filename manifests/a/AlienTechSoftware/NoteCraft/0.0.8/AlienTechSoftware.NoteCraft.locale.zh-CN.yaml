ShortDescription: 净室重实现的 OneNote 替代品，本地文件优先，同步方式由你决定。
Description: |-
  NoteCraft 是对 OneNote 笔记本体验的开源净室（clean-room）重实现，以本地文件为核心。笔记本、分区、页面、图片和附件都以普通的文件夹和文件形式保存在你的设备上。你可以用自己已经信任的工具来同步和备份，不需要 NoteCraft 服务器或账户。
  笔记本就是一个文件夹，页面就是 index.html 或 index.md 及其旁边的图片，因此页面可以无限层级嵌套，你的笔记在任何编辑器、Git 或自选的同步文件夹里都保持可读。页面源视图会列出一个页面拥有的每个文件——页面自身文本及其元数据、绘图和图片，让你无需听信任何人的说辞就能检查笔记里到底有什么。
  你可以直接在页面上以最终外观书写：标题、加粗、斜体、链接、引用、列表、以纯文本存储的待办标签、可移动和调整大小的容器、就地渲染的 Mermaid 图表，以及原生排版的 TeX 公式。页面可采用 HTML 或 CommonMark + GFM 格式，按页面、分区、笔记本或全局设置，编辑时文件保持自身格式不变。搜索覆盖所有笔记本的所有页面，14 套浅色和深色主题的对比度由测试保证。
  Office 风格的功能区、彩色的笔记本和分区、直接书写的页面，意味着无需学习新东西。每个操作都是一条带 ID 的命令，由窗口、命令行、回环控制通道和 MCP 服务器共享，AI 助手因此可以在没有云账户的情况下操作你的笔记。导入器可以把一组 .one 分区文件转换成任一页面格式的笔记本、分区、页面和子页面，并保留图片和附件。
