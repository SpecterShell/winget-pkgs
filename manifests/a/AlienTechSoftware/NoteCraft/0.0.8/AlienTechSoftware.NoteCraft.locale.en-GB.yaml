ShortDescription: A clean-room OneNote recreation for local files and sync on your terms.
Description: |-
  NoteCraft is an open-source, clean-room recreation of the OneNote notebook experience. It keeps notebooks, sections, pages, pictures and attachments as ordinary folders and files on your device. You can choose how to sync and back them up, using tools you already trust, without a NoteCraft server or account.
  A notebook is a folder and a page is index.html or index.md with its pictures beside it, so pages nest as deep as you like and your notes stay readable in any editor, in git, or in the sync folder of your choice. A page source view lists every file a page owns, the page's own text with its head, the drawing, the pictures, so you can check what your notes contain without taking anyone's word for it.
  You write straight on the page in its finished look: headings, bold, italic, links, quotes, lists, to-do tags stored as plain text, containers you move and resize, Mermaid diagrams drawn where they stand, and TeX equations typeset natively. Pages are HTML or CommonMark + GFM, chosen per page, per section, per notebook or globally, and the file keeps its own format when you edit it. Search covers every page of every notebook, and 14 themes in light and dark keep their contrast guaranteed by a test.
  The Office-style ribbon, coloured notebooks and sections, and a page you write on directly mean nothing new to learn. Every action is a command with an id, shared by the window, a command line, a loopback control channel and an MCP server, so an assistant can use your notes without a cloud account. An importer turns a folder of .one section files into notebooks, sections, pages and sub-pages in either page format, with pictures and attachments.
