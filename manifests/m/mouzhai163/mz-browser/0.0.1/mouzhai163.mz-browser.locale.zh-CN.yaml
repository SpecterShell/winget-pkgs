ReleaseNotes: |-
  MZ 指纹浏览器 在 GitHub 上的第一个版本。之后的版本都在这里发布，软件会自动检查更新。
  从旧版本升级
  - 以前装过 0.1.x（从 Gitea 下载）的，请手动下载这个安装包覆盖安装，环境和数据都会保留。版本号从 0.0.1 重新开始计算，比 0.1.x 小，所以旧版本的自动更新不会提示它
  - 代理密码、账号密码、Cookie、MCP 令牌加密保存，只有当前电脑的当前 Windows 用户能解开。把数据拷到别的电脑或换用户后，这些内容会变成空的，需要重新填写
  - 内核需要在“设置 → 浏览器与自动化 → 浏览器内核”里手动更新到 mz3，下面的内核修复才会生效
  新增
  - 自动检查更新：启动后检查一次，标题栏出现更新按钮；设置页也可以手动检查。更新包带签名，签名不对不会安装
  - 环境完整备份：环境页导出 JSON，包含配置、指纹、内核、代理、账号、启动网址、分组和标签，可选带上密码和 Cookie。“导入数据”时，本机没用过原环境 ID 就沿用它，指纹完全不变；分组、标签、代理、账号已经有的直接复用；任何一个环境失败就整体撤销
  内核（155.0.8059.86 / 156.0.8078.96 / 157.0.8103.51，mz3）
  - 浏览器自身的后台连接也走环境代理，代理配好之前不联网
  - TLS 扩展顺序和官方 Chrome 一样随机排列；navigator.platform 跟随系统身份
  - toBlob 和 toDataURL 使用相同的 Canvas 噪声；媒体设备的占位名称改为真实格式
  - 环境里不再检查组件更新；调试端口需要每次启动生成的令牌，网页也探测不到软件在本机开的端口
  - 第一个启动网址打开在前台
  变更与修复
  - MCP：获取调试地址、读字段值、HTML 和执行脚本需要完整页面权限；没有时任务变量和运行记录里的敏感内容显示为 [hidden]
  - 彻底删除环境时一并删除浏览器数据目录
  - RPA：调试和定时任务不再同时操作同一个浏览器；必填参数在所有运行方式下校验；停止后不再启动环境；超时后关掉多余标签；被裁切或 fixed 浮层元素能正常点击；脚本没执行时不再报成功
  - 账号导入允许没有密码；代理和账号的 CSV 能正确读取引号里的换行和 Excel 保存的文件
  - 导出代理时“不导出密码”生效；关闭同步器窗口后停止同步
  - 界面不再从外网加载国旗、网站图标和图标字体
