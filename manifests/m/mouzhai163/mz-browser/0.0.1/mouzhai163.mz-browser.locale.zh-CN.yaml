ShortDescription: 本地优先的指纹浏览器工作台：每个环境都是一个独立、隔离、指纹自洽的浏览器。
Description: |-
  MZ指纹浏览器是一款运行在用户自己电脑上的桌面软件，用来创建、运行和管理大量相互隔离的浏览器环境。每个环境有自己的数据目录、代理、指纹和账号，并可以用 RPA 任务流或 AI（MCP）自动操作。数据默认只保存在本机，没有账号体系、没有云端服务、没有环境数量限制。

  特点：

  - 内核级指纹：指纹在浏览器内核的 C++ 层修改，页面脚本无法通过检查函数或原型发现改动。
  - 指纹自洽：UA、Client Hints、平台、GPU、核心数、内存、分辨率来自同一份设备档案。
  - 环境稳定：指纹由环境 ID 派生，重启不变；浏览器完整版本号在创建时固定。
  - 严格隔离：每个环境独立的数据目录，Cookie、localStorage、IndexedDB 互不共享。
  - 真实操作：RPA 使用真实的鼠标键盘事件，页面看到的是可信事件。
  - 本地优先：单用户工作台，业务数据存在本地 SQLite。

  主要功能：环境管理与批量创建、浏览器内核按需下载（定制 Chromium 155-157 与基于 Camoufox 的 Firefox 158）、代理中心与账号管理、本地扩展库、RPA 任务流与定时运行、窗口同步器，以及内置的本地 MCP 服务器供外部 AI 客户端使用。
