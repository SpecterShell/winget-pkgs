PackageIdentifier: mouzhai163.mz-browser
PackageVersion: 0.0.1
PackageLocale: en-US
ShortDescription: 'A local-first fingerprint browser workbench: every environment is an isolated browser with a self-consistent fingerprint.'
Description: |-
  MZ Browser is a desktop app that runs on your own computer. It creates, runs and manages many isolated browser environments. Each environment has its own data directory, proxy, fingerprint and accounts, and can be automated with RPA workflows or AI clients over MCP. Data stays on your machine by default. There are no user accounts, no cloud service and no environment limits.

  Highlights:

  - Kernel-level fingerprints: changes are made in the browser's C++ layer rather than injected as JavaScript, so page scripts cannot find them by inspecting functions or prototypes.
  - Self-consistent profiles: UA, Client Hints, platform, GPU, core count, memory and resolution come from one device profile.
  - Stable environments: the fingerprint is derived from the environment ID and survives restarts, and the full browser version is fixed at creation.
  - Strict isolation: a separate data directory per environment; cookies, localStorage and IndexedDB are never shared.
  - Real input: RPA uses real mouse and keyboard events with human-like movement and typing.
  - Local-first: a single-user workbench with local SQLite storage.

  Features include environment management with batch creation, browser kernels downloaded on demand (customized Chromium 155-157 and a Firefox 158 based on Camoufox), a proxy center with account management, a local extension library, RPA workflows with schedules and run history, a window syncer, and a built-in local MCP server for external AI clients.
