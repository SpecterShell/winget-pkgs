ShortDescription: 为会被建造出来的东西而生的开源 NURBS 建模器。
Description: |-
  Serpentine3D 是一款面向实际建造工作的开源 NURBS 建模器：提供精确的曲线和曲面、车间可以照图施工的图纸、会说 Rhino 命令的命令行，以及能够驱动这一切的助手。它可在 Linux、Windows 和 macOS 上运行，免费且无需账户。
  精确几何来自 OpenCASCADE 内核上的 NURBS 曲线、曲面和实体，而非网格。Rhino .3dm、STEP、DXF、SVG、OBJ、FBX 和 STL 文件均可导入导出；支持导出 glTF、USD 和 3MF；可导入 E57 点云。命令行与 Rhino 语法互通：loft、sweep2、filletedge、booleanunion 等超过 200 条命令，支持 Rhino 的别名、对象捕捉、图层，以及可用手推动面和倒圆边的操作轴（gumball）。
  图纸直接从模型生成：A4 到 A0 图幅，带实时详图视图、消隐视图、尺寸标注、剖面线和标题栏，可打印为矢量 PDF。助手看得见：描述一项修改，它就会执行命令、查看视口核对自己的工作并修正自己的错误，所有操作均可撤销。可以使用 Claude、ChatGPT 账户、OpenAI 密钥，或本地开放权重模型。
  可以在内置编辑器中编写脚本、用 serp3d-batch 批处理，或让任何 MCP 客户端驱动实时会话。建造前检查包括斑马纹分析、曲率分析、拔模分析，以及面向 3D 打印的 printcheck。
