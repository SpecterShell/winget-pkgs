ShortDescription: The open-source NURBS modeller for things that get built.
Description: |-
  Serpentine3D is an open-source NURBS modeller for things that get built: exact curves and surfaces, drawing sheets a workshop can build from, a command line that speaks Rhino, and an assistant that can drive all of it. It runs on Linux, Windows and macOS, and is free with no account.
  Exact geometry comes from NURBS curves, surfaces and solids on the OpenCASCADE kernel, not meshes. Rhino .3dm, STEP, DXF, SVG, OBJ, FBX and STL files go in and out; glTF, USD and 3MF export; E57 point clouds import. The command line speaks Rhino: loft, sweep2, filletedge, booleanunion and more than 200 others, with Rhino's aliases, object snaps, layers and a gumball that pushes faces and rounds edges by hand.
  Drawings come straight from the model: A4 to A0 sheets with live detail views, hidden-line views, dimensions, hatching and title blocks, printed to vector PDF. An assistant that can see: describe a change and it runs the commands, looks at the viewport to check its work and fixes its own mistakes, all undoable. Use Claude, a ChatGPT account, an OpenAI key, or a local, open-weight model.
  Script it in the built-in editor, batch it with serp3d-batch, or let any MCP client drive a live session. Checks before you build include zebra stripes, curvature, draft analysis and printcheck for 3D printing.
