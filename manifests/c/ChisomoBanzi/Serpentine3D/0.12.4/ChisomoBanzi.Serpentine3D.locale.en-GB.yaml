ReleaseNotes: |-
  Serpentine3D 0.12.4 makes clipping planes govern what the cursor can snap to and pick, and makes the results of Join and Explode easier to follow.
  Fixed
  - Snapping respects clipping planes. Cut-away endpoints, curves, solids, meshes and scan points no longer attract the cursor. Near snapping follows the visible part of a curve, and Int snapping finds the exact cut. Paused planes and per-view switches are respected, including inside sheet details.
  - Cut-away scan points cannot be selected. Clicking or dragging a selection box in the clipped-away part of a scan no longer selects it; visible samples still work normally.
  - The cut stays precise at survey coordinates. Moving a model millions of units from the origin no longer widens the clipping tolerance and admits hidden points near the cut.
  Changed
  - Join and Explode keep their results selected. New results briefly flash white before settling back to gold. Explode also keeps objects it cannot split selected alongside the new pieces, without flashing the unchanged objects.
  - Enter or right-click ends Join with one picked object. The object stays unchanged and the command finishes. Commands such as Loft still wait for their minimum selection.
  - Join and Explode lead the middle-click popup, with paired icons. The popup retains twelve distinct recent commands, its usual shortcuts and the command palette.
  Contributed by Jonas Pedrotti in #128 and #143, with integration fixes and regression coverage.
  No native file-format change.
  Full changelog
