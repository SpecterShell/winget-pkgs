ReleaseNotes: |-
  New Features
  - Added initial support for the Signal Processing Toolbox, covering filter design (Butterworth, Chebyshev, elliptic, Bessel, FIR equiripple, least-squares and constrained least-squares, complex FIR minimax), filter analysis and conversion between filter forms, windows, waveform generation, resampling, linear prediction and AR spectral estimation, cepstral and Hilbert-based analysis, periodogram, Welch, multitaper, Lomb-Scargle and subspace spectral estimation, pulse and transition measurements, change-point and envelope detection, time-frequency analysis (STFT, Wigner-Ville), and pole-zero plots with zplane, altogether covering hundreds of MATLAB functions.
  - Added subexpr, which picks the common subexpression that saves the most symbolic nodes.
  - Added symmatrix, symmatrix2sym, symfunmatrix and symfunmatrix2symfun for working with symbolic matrices.
  - Added a grid visualizer for viewing matrices and other variables that are too big to fit on one line.
  - line() now accepts matrix data and draws one line per column, following MATLAB's vector/matrix pairing rules and errors.
  Updates and Fixes
  - Fixed plot export falling back incorrectly when the platform's usual fonts are unavailable.
  - line() now returns matlab.graphics.primitive.Line objects, matching MATLAB's class.
  - Improved the accuracy of several Signal Processing Toolbox functions to better match MATLAB.
