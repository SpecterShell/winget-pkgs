ShortDescription: Fast live script editor and runtime for MATLAB code.
Description: |-
  MatLivre is a fast live script editor and runtime for MATLAB code. It opens, edits and runs MATLAB live scripts (.mlx) and plain scripts (.m) with results, tables and figures inline, in a native Windows 11 app. The language engine is an independent, clean-room implementation of MATLAB, written in Rust: no MATLAB installation, license or Java runtime is needed.
  - Starts in a blink. The app is ready in 0.3 s (1 s on a first launch).
  - Runs live scripts fast. A typical notebook with four figures runs in 0.11 s.
  - Runs code fast. On a 12-case benchmark of loops, recursion, array growth, linear algebra, sorting, strings, structs and cells, MatLivre is 5.5x faster than MATLAB R2023b, 83x faster than GNU Octave and 83x faster than Scilab (geometric mean), with identical results in all four.
  - Speaks MATLAB. 1,889 MATLAB and Symbolic Math Toolbox functions, MATLAB's display format, error messages and semantics, checked against MATLAB R2023b output.
  - One small program. A single executable that depends only on DLLs shipped with Windows.
