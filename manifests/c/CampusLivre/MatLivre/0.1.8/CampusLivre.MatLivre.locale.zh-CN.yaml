PackageIdentifier: CampusLivre.MatLivre
PackageVersion: 0.1.8
PackageLocale: zh-CN
ShortDescription: 快速的 MATLAB 代码实况脚本编辑器与运行时。
Description: |-
  MatLivre 是一款快速的 MATLAB 代码实况脚本编辑器与运行时。它可以在原生 Windows 11 应用中打开、编辑并运行 MATLAB 实况脚本（.mlx）和普通脚本（.m），结果、表格和图形内联显示。其语言引擎是用 Rust 编写的 MATLAB 独立净室实现：无需安装 MATLAB，无需许可证，也无需 Java 运行时。
  - 眨眼间即可启动。应用在 0.3 秒内就能就绪（首次启动约 1 秒）。
  - 快速运行实况脚本。一个包含四幅图形的典型脚本只需 0.11 秒即可运行完毕。
  - 快速运行代码。在涵盖循环、递归、数组增长、线性代数、排序、字符串、结构体和元胞数组的 12 项基准测试中，MatLivre 的速度是 MATLAB R2023b 的 5.5 倍，是 GNU Octave 和 Scilab 的 83 倍（几何平均值），且四者的结果完全一致。
  - 深谙 MATLAB。覆盖 1,889 个 MATLAB 和符号数学工具箱函数，并对照 MATLAB R2023b 的输出校验了显示格式、错误消息和语义。
  - 一个小巧的程序。单个可执行文件，仅依赖 Windows 自带的 DLL。
