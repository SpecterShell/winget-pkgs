ReleaseNotes: |-
  LiveAgent v2.0.21
  内置 K-brain v0.107.33。
  新功能
  - 联网搜索回退（#1296，修复 #1289）：没有原生联网搜索的模型接口（OpenAI Chat Completions 兼容接口，如 DeepSeek、各类中转）现在也能联网。
    - 新增「设置 → 联网搜索」页：选择搜索服务（Tavily、Brave Search、SearXNG、博查、Jina），填写 API Key / 服务地址和结果条数。Key 只写不读，页面只显示是否已设置及其来源。
    - 输入框的「联网」开关：当前模型支持原生搜索时照旧；不支持时，如已配置搜索服务则可开启，并标注「经由 SearXNG」等所用服务；未配置时开关置灰，下方提示可直接跳转到设置页。
    - 搜索调用在对话中显示为搜索行，可展开查看查询词和结果。
    - 审批与 web_fetch 一致：「始终询问」模式下会先请求确认。
    - 桌面端与 WebUI 均可用。
  修复
  - 内置浏览器加载失败说明（#1295）：证书错误、域名无法解析、连接被拒绝、超时、离线等情况会显示对应的中文/英文说明，并新增「在默认浏览器中打开」按钮；修复连接被拒绝等错误页一闪而过、被 Chromium 自带错误页替换的问题。
  - 刷新模型目录（#1281）。
  内置 K-brain v0.107.33
  - 新增 web_search 工具与第三方搜索服务配置（K-brain #206）。
  - 取消运行时等待子任务记录完成，旧的子代理通知不再被当成用户发言（K-brain #204）。
  完整变更：https://github.com/Stack-Cairn/LiveAgent/compare/v2.0.20...v2.0.21
