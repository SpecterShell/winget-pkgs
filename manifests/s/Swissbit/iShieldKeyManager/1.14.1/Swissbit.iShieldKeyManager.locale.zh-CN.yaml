PackageIdentifier: Swissbit.iShieldKeyManager
PackageVersion: 1.14.1
PackageLocale: zh-CN
License: 专有软件
ShortDescription: iShield Key 硬件安全密钥的配置工具。
Description: |-
  iShield Key Manager 是 Swissbit iShield Key 与 iShield Key 2 硬件安全密钥的配套配置工具。
  应用程序通过 USB 或 NFC 管理密钥上的各类认证应用：
  - FIDO：注册和管理 WebAuthn/FIDO2 通行密钥，并可重置 FIDO 应用。
  - 口令：管理 PIN 以及 TOTP、HOTP 一次性口令槽位。
  - PIV：管理 PIV 应用，包括 PIN、密钥和证书。
  同一 iShield Key Management Kit 发行包还包含命令行工具（iKMcli）和适用于 Windows 的 Swissbit PIV 迷你驱动。
  Swissbit iShield Key 2 将 FIDO2 与 NFC 连接相结合，提供 USB-A 和 USB-C 两种形态。该系列支持防钓鱼的多因素认证，是零信任战略的重要组成部分，并通过 FIDO2 标准认证，另提供 MIFARE DESFire EV3 和 FIPS 140-3 3 级认证版本。
