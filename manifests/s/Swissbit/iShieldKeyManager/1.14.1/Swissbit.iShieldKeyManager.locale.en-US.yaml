ShortDescription: Configuration tool for iShield Key devices.
Description: |-
  iShield Key Manager is the companion configuration tool for Swissbit iShield Key and iShield Key 2 hardware security keys.
  The application manages the authentication applications of an iShield Key over USB or NFC:
  - FIDO: register and manage WebAuthn/FIDO2 passkeys and reset the FIDO application.
  - Passcodes: manage PINs and one-time password slots for TOTP and HOTP.
  - PIV: manage the PIV application, including PINs, keys, and certificates.
  A command line tool (iKMcli) and a Swissbit PIV minidriver for Windows are part of the same iShield Key Management Kit distribution.
  Swissbit iShield Key 2 combines FIDO2 with NFC connectivity and is available in USB-A and USB-C form factors. The series supports phishing-resistant multi-factor authentication for zero trust strategies and is certified according to FIDO2 standards, with MIFARE DESFire EV3 and FIPS 140-3 Level 3 variants available.
