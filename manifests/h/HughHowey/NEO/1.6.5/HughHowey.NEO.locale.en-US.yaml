ReleaseNotes: |-
  - The drop cap stays put while you edit a chapter's first paragraph. It no longer disappears when you click into it.
  - Two devices on one library: a chapter added on one device is no longer dropped when the other saves (#526). Update NEO on every device you write on.
  - A chapter changed on another device is kept as its own copy, even when only formatting, order or a deletion changed (#466, thanks @iannitram)
  - ⌘Z brings back a cut footnote (#477, #488, thanks @kiyomi015)
  - Spellcheck underlines return when a book is reopened (#514, thanks @kiyomi015)
  - The Chapters pane no longer opens over the outline's outer cards (#523)
  - Danish spellcheck and typing (#521, thanks @madsdyd)
  - Ukrainian spellcheck and interface (#509, thanks @qmanana336)
  - German interface completed, Swiss German added (#513, thanks @kaimueri)
  - NEO Pocket: pick NEO's language in your phone's per-app language settings (#507, #517, thanks @kiyomi015)
  - Copying from a chapter's first paragraph into another program no longer carries a stray indent
  - Security: NEO's window can no longer be taken to another page by a link inside a chapter file
