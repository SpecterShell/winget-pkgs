ShortDescription: A distraction-free novel-writing word processor.
Description: |-
  NEO understands from the moment you install it that you are writing books and nothing else. No bloat, no distractions, with manuscripts that look like books as you write them. NEO runs locally, work-in-progress manuscripts are saved in plain files on your disk, and there are no accounts or subscriptions.
  Your library looks like a bookshelf, not a file list. Labeled shelves can be organized by series, by status, or by pen name, progress bars on the covers show how far you are from your word goals, and books can be dragged anywhere.
  There is a blank page by default or a dark mode. Controls fade until you mouse over them, chapters number and renumber themselves automatically, drop caps mark chapter openings, and em dashes, true ellipses, and curly quotes sort themselves out as you type. Spellcheck exists only when you invoke it.
  One Enter makes a new paragraph, two make a *** section break, and three start a new chapter. Right-click the first chapter's heading to make it a prologue or the last one's to make it an epilogue, and everything renumbers.
  Placeholders drop a mark with a sticky note for a name, fact, or date, and the panels list every item you need to return to.
  The Outline tab lays the book out as index cards that read left to right. Write a few lines on a card and the note shows up in the manuscript as a ghost paragraph; drag a card to move it and the writing moves with it.
  Every book gets a cover. New books are dressed in a seeded abstract so no two stories on the shelf look alike, and once a story passes 1,000 words NEO can paint an abstract cover from the text using an OpenAI API key.
  Daily word goals, word sprints, and a NaNoWriMo-style progress chart track momentum.
  A shelf can be bound into one book for an omnibus, a trilogy, or a story collection, with copyright, dedication, epigraph, prologue, epilogue, acknowledgments, and about-the-author pages, exported as a single EPUB, Word file, or PDF.
  Screenplays work the same way: start a line with INT. or EXT. and it becomes a scene heading, and exports include an industry-format PDF, Fountain, or Final Draft (.fdx) file.
  Exports include EPUB 3 built to KDP's guidelines, Word .docx, PDF with page numbers and bookmarks, HTML, markdown, and plain text. Import brings in existing .docx, .txt, and .md manuscripts with automatic chapter and scene-break detection.
  Continuous autosave and daily zip backups kept for two weeks protect the work, all stored as plain files under the NEO Library folder: one folder per book, chapters as readable HTML, metadata as JSON.
