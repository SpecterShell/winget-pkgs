PackageIdentifier: HughHowey.NEO
PackageVersion: 1.6.5
PackageLocale: zh-CN
ShortDescription: 一款为小说写作而生的无干扰文字处理器。
Description: |-
  NEO 从安装的那一刻起就知道你在写的是书，而不是别的东西。没有臃肿的功能，没有干扰，写作时手稿就像一本真正的书。NEO 在本地运行，进行中的稿件以纯文本文件保存在磁盘上，没有账户，也没有订阅。
  你的书库看起来像一个书架，而不是文件列表。书架可以贴上标签，按系列、状态或笔名自由整理，封面上的进度条显示你距离字数目标还有多远，书可以随意拖放。
  默认是一张白纸，也可以切换到深色模式。控件在你鼠标靠近前会自动隐藏。章节自动编号和重新编号，首字下沉标记章节开头，破折号、真正的省略号和弯引号在你打字时自动调整。拼写检查只在你主动调用时才出现。
  按一次 Enter 新起一段，按两次插入 *** 分节符，按三次开始新章节。右键第一章标题可将它设为序言，右键最后一章可将它设为尾声，编号会自动重排。
  写作中途需要人名、史实或日期时，可以放置占位标记和便签，两侧面板会列出所有需要回头处理的项目。
  "大纲"标签页把整本书铺成一张张索引卡片，从左到右依次排列。在卡片上写几句话，这段提示就会以灰色幽灵段落的形式出现在手稿中；拖动卡片调整结构，正文会随之移动。
  每本书都有封面。新书会自动生成一幅独一无二的抽象封面，当故事超过 1,000 字后，NEO 还可以借助 OpenAI API 密钥根据文本内容绘制抽象封面。
  每日字数目标、写作冲刺和 NaNoWriMo 风格的进度图帮助你保持写作势头。
  一个书架可以合并为一本书，制作合集、三部曲或选集，包含版权页、献词、题记、序言、尾声、致谢和作者简介，并导出为带单一封面和完整目录的 EPUB、Word 或 PDF 文件。
  剧本同样支持：以 INT. 或 EXT. 开头的行会成为场景标题，可导出符合行业标准的 PDF、Fountain 或 Final Draft (.fdx) 文件。
  导出格式包括遵循 KDP 规范的 EPUB 3、Word .docx、带页码和书签的 PDF、HTML、Markdown 和纯文本。导入支持现有的 .docx、.txt 和 .md 手稿，自动识别章节和分节符。
  持续自动保存和保留两周的每日 zip 备份保护你的作品，全部以纯文件形式存放在 NEO Library 文件夹中：每本书一个文件夹，章节为可读的 HTML，元数据为 JSON。
