PackageIdentifier: HungryDetective.DownloadCraft
PackageVersion: 0.9.17
PackageLocale: zh-CN
ShortDescription: 一款快速、免费的下载管理器，其浏览器扩展能捕捉其他工具错过的视频。
Description: |-
  一款快速、免费的下载管理器，配有能捕捉其他工具错过的视频的浏览器扩展。
  多连接下载、队列与计划任务，通过应用内置的 yt-dlp 支持 YouTube 及 1000 多个站点，扩展既可与应用配合，也可独立工作。
  功能
  下载
  - 动态分段（1–32 个连接）：空闲连接会接管预计最晚完成部分的一半，因此没有连接会在另一连接缓慢时闲置。崩溃安全的续传、自愈连接和自动刷新链接。
  - 全局速度限制、按下载的连接数和按服务器的连接上限。
  - 队列支持并发限制、计划任务、重试全部失败项和完成动作（关机 / 睡眠 / 休眠）。
  - HLS 和 DASH 流（直播录制、AES-128），视频与音频用 FFmpeg 合并。
  视频站点
  - 通过应用内置的 yt-dlp 支持 YouTube 及 1000 多个站点，自动保持更新——1080p、4K 及音视频合并。
  - 从页面本身检测 Facebook / Instagram 短视频、Vimeo、Bilibili 和通用播放器。
  浏览器扩展（Chrome、Edge、Brave、Firefox）
  - 从网络流量、清单和页面数据中捕捉视频——HLS、DASH、MP4/WebM、字幕。
  - IDM 式交接。浏览器下载会被暂停后交给应用；应用无法接管时会在浏览器中继续，因此不会丢失任何内容。
  - 无需应用也可工作：在浏览器中直接下载、拼接并保存视频。
  应用
  - 系统 / 深色 / 浅色主题、状态侧边栏、搜索、可排序和可调宽度的列、批量操作。
  - 剪贴板检测、通知、托盘图标、杀毒软件钩子，以及共享同一队列的命令行界面。
